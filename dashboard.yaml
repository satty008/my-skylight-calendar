                                      return {action: 'call-service', service: 'script.chore_undo_funny', service_data: {disapprove_entity_id: 'button.satty_choreops_disapprove_chore_take_out_trash', chore_name: 'Take out trash', person_name: 'Satty'}};
                                    }
                                    return {action: 'call-service', service: 'script.chore_complete_celebrate', service_data: {claim_entity_id: 'button.satty_choreops_claim_chore_take_out_trash', chore_name: 'Take out trash', person_name: 'Satty'}};
                                  ]]]
                                custom_fields:
                                  photo: |
                                    [[[ return `<img src="${states['person.ram_sambamurthy'].attributes.entity_picture}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;display:block;">` ]]]
                                  badge: |
                                        [[[
                                          const st = states[entity.entity_id];
                                          const due = st.attributes.due_date;
                                          const t = new Date();
                                          const todayStr = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
                                          let label, bg;
                                          if (st.state === 'completed') { label = 'Done'; bg = '#238636'; }
                                          else if (due && due.slice(0, 10) < todayStr) { label = 'Overdue'; bg = '#da3633'; }
                                          else if (due && due.slice(0, 10) === todayStr) { label = 'Due'; bg = '#9a6700'; }
                                          else { label = 'Open'; bg = '#57606a'; }
                                          return `<span style="display:inline-block;padding:2px 10px;border-radius:999px;background:${bg};color:#fff;font-size:0.72em;font-weight:700;white-space:nowrap;">${label}</span>`;
                                        ]]]
                                styles:
                                  card:
