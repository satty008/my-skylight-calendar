views:
  - type: sections
    max_columns: 10
    title: Family Calendar
    path: family-calendar
    theme: Skylight
    sections:
      # --- START CONTROLS SECTION (Buttons) ---
      # Slimmed down: the big "Family Calendar" title text and the
      # Satty/Bhavi buttons both moved out (title is redundant with the
      # view's own header, already shown smaller at the top of the page;
      # Satty/Bhavi are now profile-photo buttons directly above their
      # chore columns in the CHORES SECTION below). Select View + Show
      # Events are stacked vertically and pushed to the right, both
      # shrunk via zoom.
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: markdown
                content: " "
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
                grid_options:
                  columns: 85
                  rows: auto
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: select
                    entity: input_select.calendar_view
                    show_name: true
                    show_state: true
                    name: Select View
                    show_last_changed: false
                    show_attribute: false
                    card_mod:
                      style: |
                        ha-card { zoom: 0.75 !important; }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: input_boolean.family_calendar_show
                    name: Show Events
                    icon: mdi:calendar-eye
                    show_icon: true
                    show_name: true
                    tap_action:
                      action: perform-action
                      perform_action: input_boolean.toggle
                      target:
                        entity_id: input_boolean.family_calendar_show
                    styles: |
                      .bubble-button-background {
                        opacity: 1 !important;
                        background-color: ${hass.states['input_boolean.family_calendar_show'].state === 'on' ? 'var(--calendar1-default-primary-color)' : 'light-grey'} !important;
                      }
                    card_mod:
                      style: |
                        ha-card { zoom: 0.75 !important; }
                grid_options:
                  columns: 35
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
        column_span: 10
      # --- End CONTROLS SECTION (Buttons) ---
      # --- START CHORES SECTION (Today + Weather + ChoreOps, tap to complete) ---
      # Uses ChoreOps entities directly via button.press, NOT the ChoreOps
      # "Add/Edit Chore" config-flow UI - that UI crashes the frontend on
      # every submit in v1.5.1-beta.3 (confirmed: every attempt threw an
      # uncaught exception and silently discarded the input). Chores were
      # created instead via the choreops.create_chore service (Developer
      # Tools > Actions), which works fine and requires a due_date whenever
      # a recurring frequency is set (used as the recurrence anchor date).
      # To add a new recurring chore: call choreops.create_chore with
      # frequency + due_date + assigned_user_names, then add a button-card
      # entry below pointing at its claim/disapprove button entities
      # (button.<person>_choreops_claim_chore_<chore> /
      #  button.<person>_choreops_disapprove_chore_<chore>).
      # This is the single "main" block: date/weather header (big orange date
      # badge + day name, plus month and a live time line, weather top-right),
      # then a Satty/Bhavi selector row (profile-photo bubble-card buttons,
      # colored when that person is the one shown, grey when hidden - calls
      # the SAME calendar1/2_calendar_visible_filter exclusive-select scripts
      # as before), then each person's chore column. The selector buttons live
      # OUTSIDE the `conditional` wrapping (always rendered) so tapping a
      # hidden person's button still works to re-select them; only the actual
      # chore list beneath is conditionally hidden.
      # Each chore tile carries a small circular profile-photo badge on the
      # LEFT (button-card custom_fields "photo", ahead of the checkbox icon)
      # in addition to the existing color-coded left border.
      - type: grid
        cards:
          - type: vertical-stack
            card_mod:
              style: |
                ha-card {
                  background: rgba(20, 20, 26, 0.75) !important;
                  border: solid 1px rgba(255, 255, 255, 0.15) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
                  padding: 0.6em 0.8em !important;
                }
            cards:
              - type: markdown
                # ha-markdown-element strips BOTH style="..." and class="..."
                # attributes via DOMPurify (confirmed via getComputedStyle - class
                # ended up "" on every rendered node even though the source markdown
                # had class="..."). ha-icon's icon="..." attribute does survive.
                # Styled entirely with structural/positional selectors below instead.
                # card_mod must ALSO pierce ha-markdown's own nested shadow root via
                # the "ha-markdown$:" key - a plain top-level `style: |` string lands
                # one shadow boundary too shallow.
                content: |
                  {% set icons = {'sunny':'mdi:weather-sunny','clear-night':'mdi:weather-night','cloudy':'mdi:weather-cloudy','partlycloudy':'mdi:weather-partly-cloudy','rainy':'mdi:weather-rainy','pouring':'mdi:weather-pouring','snowy':'mdi:weather-snowy','snowy-rainy':'mdi:weather-snowy-rainy','fog':'mdi:weather-fog','windy':'mdi:weather-windy','windy-variant':'mdi:weather-windy','hail':'mdi:weather-hail','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','exceptional':'mdi:alert'} %}
                  <div>
                    <div>
                      <div>
                        <span>{{ now().day }}</span>
                        <span>{{ now().strftime('%A') }}</span>
                      </div>
                      <div>
                        <span>{{ now().strftime('%B %Y') }}</span>
                        <span>{{ now().strftime('%H:%M') }}</span>
                      </div>
                    </div>
                    <div>
                      <span>{{ state_attr('weather.forecast_home','temperature') }}{{ state_attr('weather.forecast_home','temperature_unit') }}</span>
                      <ha-icon icon="{{ icons.get(states('weather.forecast_home'), 'mdi:weather-partly-cloudy') }}"></ha-icon>
                    </div>
                  </div>
                card_mod:
                  style:
                    ".": |
                      ha-card { background: none !important; box-shadow: none !important; border: none !important; padding: 0.2em 0.2em 0.6em 0.2em !important; }
                    ha-markdown$: |
                      ha-markdown-element > div { display: flex !important; justify-content: space-between !important; align-items: center !important; }
                      ha-markdown-element > div > div:first-child { display: flex !important; flex-direction: column !important; align-items: flex-start !important; }
                      ha-markdown-element > div > div:first-child > div:first-child { display: flex !important; align-items: baseline !important; gap: 0.5em !important; }
                      ha-markdown-element > div > div:first-child > div:first-child > span:first-child { font-size: 3em !important; font-weight: bold !important; line-height: 1 !important; background: orange !important; color: #1a1a1a !important; border-radius: 8px !important; padding: 0 0.2em !important; }
                      ha-markdown-element > div > div:first-child > div:first-child > span:last-child { font-size: 1.3em !important; font-weight: 600 !important; }
                      ha-markdown-element > div > div:first-child > div:last-child { display: flex !important; gap: 0.7em !important; font-size: 0.9em !important; opacity: 0.65 !important; margin-top: 2px !important; }
                      ha-markdown-element > div > div:last-child { display: flex !important; align-items: center !important; gap: 0.4em !important; font-size: 1.3em !important; white-space: nowrap !important; }
                      ha-markdown-element > div > div:last-child > ha-icon { width: 38px !important; height: 38px !important; color: #e0e0e0 !important; }
              - type: horizontal-stack
                cards:
                  - type: vertical-stack
                    cards:
                      - type: custom:bubble-card
                        card_type: button
                        button_type: state
                        entity: person.ram_sambamurthy
                        name: Satty
                        show_icon: true
                        show_name: true
                        tap_action:
                          action: perform-action
