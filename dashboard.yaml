button_card_templates:
  chore_tile:
    show_state: false
    show_icon: false
    tap_action: |
      [[[
        const st = states[entity.entity_id];
        const isDone = (st.attributes.global_state === 'completed' || st.attributes.global_state === 'claimed');
        const claimEntity = entity.entity_id.replace('sensor.', 'button.').replace('chore_status', 'claim_chore');
        const disapproveEntity = entity.entity_id.replace('sensor.', 'button.').replace('chore_status', 'disapprove_chore');
        const personName = st.attributes.user_name;
        const choreName = st.attributes.chore_name;
        if (isDone) {
          return {action: 'call-service', service: 'script.chore_undo_funny', service_data: {disapprove_entity_id: disapproveEntity, chore_name: choreName, person_name: personName}};
        }
        return {action: 'call-service', service: 'script.chore_complete_celebrate', service_data: {claim_entity_id: claimEntity, chore_name: choreName, person_name: personName}};
      ]]]
    double_tap_action: |
      [[[
        const st = states[entity.entity_id];
        const choreName = st.attributes.chore_name;
        const userName = st.attributes.user_name;
        const otherPerson = userName === 'Satty' ? 'Priya' : 'Satty';
        const closeAction = {action: 'fire-dom-event', browser_mod: {service: 'browser_mod.close_popup', data: {}}};
        const mkBtn = (name, offset) => ({
          type: 'button',
          name: name,
          show_icon: false,
          tap_action: {
            action: 'fire-dom-event',
            browser_mod: {
              service: 'browser_mod.sequence',
              data: {
                sequence: [
                  {service: 'script.chore_postpone_apply', data: {chore_name: choreName, user_name: userName, offset: offset}},
                  {service: 'browser_mod.close_popup', data: {}}
                ]
              }
            }
          }
        });
        return {
          action: 'fire-dom-event',
          browser_mod: {
            service: 'browser_mod.popup',
            data: {
              title: choreName,
              content: {
                type: 'vertical-stack',
                cards: [
                  mkBtn('Tomorrow', 'tomorrow'),
                  mkBtn('Same day next week', 'next_week'),
                  mkBtn('Next month', 'next_month'),
                  {
                    type: 'entities',
                    title: 'Or pick a custom date',
                    entities: [
                      {entity: 'input_datetime.chore_postpone_custom_date', name: 'Custom date'},
                      {
                        type: 'call-service',
                        name: 'Confirm custom date',
                        icon: 'mdi:check',
                        service: 'script.chore_postpone_apply',
                        service_data: {chore_name: choreName, user_name: userName, offset: 'custom'}
                      }
                    ]
                  },
                  {
                    type: 'button',
                    name: 'Move to ' + otherPerson + "'s list",
                    show_icon: false,
                    tap_action: {
                      action: 'fire-dom-event',
                      browser_mod: {
                        service: 'browser_mod.sequence',
                        data: {
                          sequence: [
                            {service: 'choreops.update_chore', data: {name: choreName, assignment_action: 'replace', assigned_user_names: [otherPerson]}},
                            {service: 'browser_mod.refresh', data: {}}
                          ]
                        }
                      }
                    }
                  },
                  {
                    type: 'button',
                    name: 'Cancel',
                    show_icon: false,
                    tap_action: closeAction
                  }
                ]
              }
            }
          }
        };
      ]]]
    custom_fields:
      photo: |
        [[[
          const personPrefix = entity.entity_id.split('.')[1].split('_choreops_')[0];
          const personEntity = personPrefix === 'satty' ? 'person.ram_sambamurthy' : 'person.bhavi';
          return `<img src="${states[personEntity].attributes.entity_picture}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;display:block;">`;
        ]]]
      freq: |
        [[[
          const st = states[entity.entity_id];
          const f = st.attributes.recurring_frequency;
          const interval = st.attributes.custom_frequency_interval;
          const unit = st.attributes.custom_frequency_unit;
          let label;
          if (f === 'daily') label = 'Daily';
          else if (f === 'week_end') label = 'Weekly';
          else if (f === 'month_end') label = 'Monthly';
          else if (f === 'quarter_end') label = '3mo';
          else if (f === 'custom' && unit === 'days' && interval <= 4) label = '2x/wk';
          else if (f === 'custom' && unit === 'days' && interval <= 20) label = '2x/mo';
          else label = f || '';
          return `<span style="display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.65);font-size:0.65em;font-weight:600;white-space:nowrap;">${label}</span>`;
        ]]]
      badge: |
        [[[
          const st = states[entity.entity_id];
          const due = st.attributes.due_date;
          const t = new Date();
          const todayStr = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
          let label, bg;
          if ((st.attributes.global_state === 'completed' || st.attributes.global_state === 'claimed')) { label = 'Done'; bg = '#238636'; }
          else if (due && due.slice(0, 10) < todayStr) { label = 'Overdue'; bg = '#da3633'; }
          else if (due && due.slice(0, 10) === todayStr) { label = 'Due'; bg = '#9a6700'; }
          else { label = 'Open'; bg = '#57606a'; }
          return `<span style="display:inline-block;padding:2px 10px;border-radius:999px;background:${bg};color:#fff;font-size:0.72em;font-weight:700;white-space:nowrap;">${label}</span>`;
        ]]]
    styles:
      card:
        - background-color: rgba(20, 20, 26, 0.75)
        - border-left: |
            [[[
              const personPrefix = entity.entity_id.split('.')[1].split('_choreops_')[0];
              const colorEntity = personPrefix === 'satty' ? 'input_text.satty_color' : 'input_text.bhavi_color';
              return '4px solid ' + states[colorEntity].state;
            ]]]
        - border-radius: 8px
        - padding: 4px 10px 4px 4px
        - margin-bottom: 4px
        - display: |
            [[[
              const st = states[entity.entity_id];
              const freq = st.attributes.recurring_frequency;
              const due = st.attributes.due_date;
              const t = new Date();
              const todayStr = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
              const visible = freq === 'daily' || (due && due.slice(0, 10) <= todayStr);
              return visible ? 'grid' : 'none';
            ]]]
        - grid-template-columns: 1fr
      grid:
        - grid-template-areas: '"photo n freq badge"'
        - grid-template-columns: 24px 1fr auto auto
        - grid-template-rows: 1fr
        - width: 100%
        - justify-content: stretch
        - align-items: center
        - column-gap: 6px
      custom_fields:
        photo:
          - justify-self: start
          - align-self: center
        freq:
          - grid-area: freq
          - justify-self: end
          - align-self: center
        badge:
          - grid-area: badge
          - justify-self: end
          - align-self: center
      name:
        - grid-area: n
        - justify-self: start
        - padding-left: 8px
        - font-size: 0.95em
        - text-decoration: |
            [[[ return (states[entity.entity_id].attributes.global_state === 'completed' || states[entity.entity_id].attributes.global_state === 'claimed') ? 'line-through' : 'none' ]]]
        - opacity: |
            [[[ return (states[entity.entity_id].attributes.global_state === 'completed' || states[entity.entity_id].attributes.global_state === 'claimed') ? '0.6' : '1' ]]]
views:
  - type: sections
    max_columns: 10
    title: Family Calendar
    path: family-calendar
    theme: Skylight
    sections:
      # --- START TOP SECTION (Forecast | Date/Time | Controls) ---
      # One row, three parts, so the whole top of the page (forecast,
      # date/time/weather, and Select View/Show Events) is as compact as
      # possible and the CHORES SECTION below can start right after
      # instead of stacking below three separate full-height sections.
      # Each part is width-constrained via card_mod max-width directly
      # on its own leaf card(s) - NOT via column_span (tried 3 of 10 on
      # a whole section, confirmed live it had zero effect) and NOT via
      # card_mod on a wrapping vertical-stack (confirmed via
      # adoptedStyleSheets that a vertical-stack's own card_mod is a
      # no-op in this card-mod/HA version, across three different
      # syntaxes, even after a hard reload ruled out staleness). The
      # forecast column uses margin-right: auto to hug the left edge of
      # its third of the row; Select View/Show Events use
      # margin-left: auto to hug the right edge of theirs; the date/time
      # markdown in the middle centers its own content instead.
      - type: grid
        cards:
          - type: horizontal-stack
            cards:
              - type: horizontal-stack
                card_mod:
                  style: |
                    .card { margin-right: auto !important; }
                cards:
                  - type: weather-forecast
                    entity: weather.forecast_home
                    forecast_type: hourly
                    show_current: false
                    show_forecast: true
                    card_mod:
                      style: |
                        ha-card { zoom: 0.78 !important; max-width: 280px !important; background: rgba(20, 20, 26, 0.75) !important; border: solid 1px rgba(255, 255, 255, 0.15) !important; border-right: none !important; border-radius: 24px 0 0 24px !important; box-shadow: none !important; padding: 0.25em 0.5em !important; box-sizing: border-box !important; }
                  - type: weather-forecast
                    entity: weather.forecast_home
                    forecast_type: daily
                    show_current: false
                    show_forecast: true
                    card_mod:
                      style: |
                        ha-card { zoom: 0.78 !important; max-width: 280px !important; background: rgba(20, 20, 26, 0.75) !important; border: solid 1px rgba(255, 255, 255, 0.15) !important; border-left: solid 1px rgba(255,255,255,0.25) !important; border-radius: 0 24px 24px 0 !important; box-shadow: none !important; padding: 0.25em 0.5em !important; box-sizing: border-box !important; }
              - type: markdown
                # ha-markdown-element strips BOTH style="..." and class="..."
                # attributes via DOMPurify (confirmed via getComputedStyle - class
                # ended up "" on every rendered node even though the source markdown
                # had class="..."). ha-icon's icon="..." attribute does survive.
                # Styled entirely with structural/positional selectors below instead.
                # card_mod must ALSO pierce ha-markdown's own nested shadow root via
                # the "ha-markdown$:" key - a plain top-level `style: |` string lands
                # one shadow boundary too shallow.
                content: |
                  {% set known_conditions = ['sunny','clear-night','cloudy','partlycloudy','rainy','pouring','snowy','snowy-rainy','fog','windy','windy-variant','hail','lightning','lightning-rainy','exceptional'] %}
                  {% set condition = states('weather.forecast_home') %}
                  {% set icon_file = condition if condition in known_conditions else 'cloudy' %}
                  <div>
                    <div>
                      <img src="/local/weather-icons/{{ icon_file }}.svg">
                      <span>{{ state_attr('weather.forecast_home','temperature') }}{{ state_attr('weather.forecast_home','temperature_unit') }}</span>
                    </div>
                    <div>
                      <span>{{ now().strftime('%H:%M') }}</span>
                    </div>
                  </div>
                  <div>
                    <span>{{ now().day }}</span>
                    <span>{{ now().strftime('%A') }}</span>
                  </div>
                  <div>
                    <span>{{ now().strftime('%B %Y') }}</span>
                  </div>
                card_mod:
                  style:
                    ".": |
                      ha-card { background: none !important; box-shadow: none !important; border: none !important; padding: 0.2em 0.2em 0.3em 0.2em !important; }
                    ha-markdown$: |
                      /* Illustrated, self-animating (embedded SMIL) SVGs from the
                         open-source Meteocons set (MIT, github.com/basmilius/weather-
                         icons) - hosted locally under www/weather-icons/ (served at
                         /local/weather-icons/) rather than relying on their CDN, since
                         the animation is baked into each file and plays natively via
                         <img src>, unaffected by ha-markdown-element's DOMPurify pass
                         (which strips style/class but leaves src alone - same reason
                         the profile-photo badges work).
                         Centered as a block within its column (was left-aligned when
                         this sat alone above the chores box) - each row's own
                         justify-content changed to center, plus centering the whole
                         markdown-element as a column. nth-child selectors target
                         ha-markdown-element's three direct <div> children, since
                         class/style attrs don't survive DOMPurify either. */
                      ha-markdown-element { display: flex !important; flex-direction: column !important; align-items: center !important; }
                      ha-markdown-element > div:nth-child(1) { display: flex !important; align-items: center !important; justify-content: center !important; gap: 1.1em !important; }
                      ha-markdown-element > div:nth-child(1) > div:first-child { display: flex !important; align-items: center !important; gap: 0.4em !important; }
                      ha-markdown-element > div:nth-child(1) > div:first-child > img { width: 46px !important; height: 46px !important; }
                      ha-markdown-element > div:nth-child(1) > div:first-child > span { font-size: 1.3em !important; }
                      ha-markdown-element > div:nth-child(1) > div:last-child > span { font-size: 2.1em !important; font-weight: 700 !important; display: inline-block !important; animation: headertimepulse 2.4s ease-in-out infinite !important; }
                      @keyframes headertimepulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
                      ha-markdown-element > div:nth-child(2) { display: flex !important; align-items: baseline !important; justify-content: center !important; gap: 0.5em !important; margin-top: 0.25em !important; }
                      ha-markdown-element > div:nth-child(2) > span:first-child { font-size: 2.3em !important; font-weight: bold !important; line-height: 1 !important; background: orange !important; color: #1a1a1a !important; border-radius: 8px !important; padding: 0 0.2em !important; }
                      ha-markdown-element > div:nth-child(2) > span:last-child { font-size: 1.2em !important; font-weight: 600 !important; }
                      ha-markdown-element > div:nth-child(3) { font-size: 0.9em !important; opacity: 0.65 !important; margin-top: 0.15em !important; text-align: center !important; }
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: select
                    entity: input_select.calendar_view
                    show_name: true
                    show_state: true
                    name: Select View
                    show_last_changed: false
                    show_attribute: false
                    card_mod:
                      style: |
                        ha-card { zoom: 0.75 !important; max-width: 260px !important; margin-left: auto !important; margin-right: 0 !important; }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: state
                    entity: input_boolean.family_calendar_show
                    name: Show Events
                    icon: mdi:calendar-eye
                    show_icon: true
                    show_name: true
                    button_action:
                      tap_action:
                        action: perform-action
                        perform_action: input_boolean.toggle
                        target:
                          entity_id: input_boolean.family_calendar_show
                    styles: |
                      .bubble-button-background {
                        opacity: 1 !important;
                        background-color: ${hass.states['input_boolean.family_calendar_show'].state === 'on' ? 'var(--calendar1-default-primary-color)' : 'light-grey'} !important;
                      }
                    card_mod:
                      style: |
                        ha-card { zoom: 0.75 !important; max-width: 260px !important; margin-left: auto !important; margin-right: 0 !important; }
            grid_options:
              columns: 120
              rows: auto
        column_span: 10
      # --- End TOP SECTION ---
      # --- START CHORES SECTION (Today + Weather + ChoreOps, tap to complete) ---
      # Uses ChoreOps entities directly via button.press, NOT the ChoreOps
      # "Add/Edit Chore" config-flow UI - that UI crashes the frontend on
      # every submit in v1.5.1-beta.3 (confirmed: every attempt threw an
      # uncaught exception and silently discarded the input). Chores were
      # created instead via the choreops.create_chore service (Developer
      # Tools > Actions), which works fine and requires a due_date whenever
      # a recurring frequency is set (used as the recurrence anchor date).
      # To add a new recurring chore: call choreops.create_chore with
      # frequency + due_date + assigned_user_names, then add a button-card
      # entry below pointing at its claim/disapprove button entities
      # (button.<person>_choreops_claim_chore_<chore> /
      #  button.<person>_choreops_disapprove_chore_<chore>).
      #
      # Status is shown as a GitHub-style pill badge on the right of each
      # tile (Done/green, Due-today/amber, Overdue/red, Open/grey - computed
      # from the sensor's state + due_date attribute) instead of a checkbox
      # icon. Tapping a tile calls script.chore_complete_celebrate (claims +
      # shows a center-screen browser_mod popup) or, if already done,
      # script.chore_undo_funny (attempts to disapprove + shows a different
      # popup) - see packages/family_calendar.yaml for both scripts.
      #
      # Each person's border-left/photo-ring color reads from
      # input_text.satty_color / input_text.bhavi_color instead of the
      # static calendar1/2-default-primary-color theme vars, so the small
      # recycle-icon button next to their name (calls script.cycle_satty_color
      # / cycle_bhavi_color) can retint their name pill AND every one of
      # their chore tiles at once by advancing that helper through a shared
      # 8-color palette.
      - type: grid
        cards:
          - type: vertical-stack
            card_mod:
              style: |
                ha-card {
                  background: rgba(20, 20, 26, 0.75) !important;
                  border: solid 1px rgba(255, 255, 255, 0.15) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
                  padding: 0.6em 0.8em !important;
                }
            cards:
              - type: horizontal-stack
                cards:
                  - type: vertical-stack
                    cards:
                      - type: horizontal-stack
                        cards:
                          - type: custom:bubble-card
                            card_type: button
                            button_type: state
                            entity: person.ram_sambamurthy
                            name: Satty
                            show_icon: true
                            show_name: true
                            show_state: false
                            # bubble-card's top-level tap_action is specifically the
                            # ICON's click action (defaults to more-info if unset) -
                            # button_action.tap_action is the one for the rest of the
                            # card (name/background). Confirmed live: with tap_action
                            # set here directly, clicking the profile photo triggered
                            # the chore-select script instead of more-info - backwards
                            # from what was wanted.
                            button_action:
                              tap_action:
                                action: perform-action
                                perform_action: script.calendar1_calendar_visible_filter
                            styles: |
                              .bubble-button-background {
                                opacity: 1 !important;
                                background-color: ${hass.states['input_text.calendar1_calendar_filter'].state === '.*' ? hass.states['input_text.satty_color'].state : 'light-grey'} !important;
                              }
                              .bubble-name, .bubble-state {
                                color: #1a1a1a !important;
                              }
                          - type: custom:button-card
                            icon: mdi:autorenew
                            show_name: false
                            show_icon: true
                            show_state: false
                            tap_action:
                              action: perform-action
                              perform_action: script.cycle_satty_color
                            styles:
                              card:
                                - background: none
                                - box-shadow: none
                                - border: none
                                - flex: "0 0 44px"
                                - width: 44px
                                - height: 44px
                                - padding: 0
                                - margin: 0 0 0.5em 0
                              icon:
                                - width: 22px
                                - color: |
                                    [[[ return states['input_text.satty_color'].state ]]]
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: input_text.calendar1_calendar_filter
                            state: ".*"
                        card:
                          type: custom:auto-entities
                          card:
                            type: vertical-stack
                          card_param: cards
                          filter:
                            include:
                              - entity_id: "sensor.satty_choreops_chore_status_*"
                                options:
                                  type: custom:button-card
                                  template: chore_tile
                          sort:
                            method: attribute
                            attribute: due_date
                  - type: vertical-stack
                    cards:
                      - type: horizontal-stack
                        cards:
                          - type: custom:bubble-card
                            card_type: button
                            button_type: state
                            entity: person.bhavi
                            name: Priya
                            show_icon: true
                            show_name: true
                            show_state: false
                            button_action:
                              tap_action:
                                action: perform-action
                                perform_action: script.calendar2_calendar_visible_filter
                            styles: |
                              .bubble-button-background {
                                opacity: 1 !important;
                                background-color: ${hass.states['input_text.calendar2_calendar_filter'].state === '.*' ? hass.states['input_text.bhavi_color'].state : 'light-grey'} !important;
                              }
                              .bubble-name, .bubble-state {
                                color: #1a1a1a !important;
                              }
                          - type: custom:button-card
                            icon: mdi:autorenew
                            show_name: false
                            show_icon: true
                            show_state: false
                            tap_action:
                              action: perform-action
                              perform_action: script.cycle_bhavi_color
                            styles:
                              card:
                                - background: none
                                - box-shadow: none
                                - border: none
                                - flex: "0 0 44px"
                                - width: 44px
                                - height: 44px
                                - padding: 0
                                - margin: 0 0 0.5em 0
                              icon:
                                - width: 22px
                                - color: |
                                    [[[ return states['input_text.bhavi_color'].state ]]]
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: input_text.calendar2_calendar_filter
                            state: ".*"
                        card:
                          type: custom:auto-entities
                          card:
                            type: vertical-stack
                          card_param: cards
                          filter:
                            include:
                              - entity_id: "sensor.priya_choreops_chore_status_*"
                                options:
                                  type: custom:button-card
                                  template: chore_tile
                          sort:
                            method: attribute
                            attribute: due_date
            grid_options:
              columns: 120
              rows: auto
        column_span: 10
      # --- End CHORES SECTION ---
      # --- START CALENDAR SECTION (Week Planner Card) ---
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.family_calendar_show
                state: "on"
            card:
              type: custom:config-template-card
              entities:
                - input_text.calendar1_calendar_filter
                - input_text.calendar2_calendar_filter
                - input_text.calendar3_calendar_filter
                - input_text.calendar4_calendar_filter
                - input_text.family_calendar_filter
                - input_select.calendar_view
              variables:
                CAL1CAL: states['input_text.calendar1_calendar_filter']?.state
                CAL2CAL: states['input_text.calendar2_calendar_filter']?.state
                CAL3CAL: states['input_text.calendar3_calendar_filter']?.state
                CAL4CAL: states['input_text.calendar4_calendar_filter']?.state
                FAMCAL: states['input_text.family_calendar_filter']?.state
                VIEW: states['input_select.calendar_view']?.state
                STARTDAY: |
                  (() => {
                    const calendarView = states['input_select.calendar_view']?.state;
                    if (calendarView === 'Today') return 'today';
                    if (calendarView === 'Tomorrow') return 'tomorrow';
                    // Fallback (valid values: monday, tuesday, wednesday, thursday, friday, saturday, sunday)
                    return 'monday';
                  })()
                DAYS: |
                  (() => {
                    const calendarView = states['input_select.calendar_view']?.state;
                    if (calendarView === 'Today') return 1;
                    if (calendarView === 'Tomorrow') return 2;
                    if (calendarView === 'Week') return 7;
                    if (calendarView === 'Biweek') return 14;
                    // else return "month"
                    return "month";
                  })()
              card:
                type: custom:week-planner-card
                calendars:
                  # --- MAP CALENDARS HERE ---
                  - entity: calendar.srnarayanan1989_gmail_com
                    name: Satty
                    color: "var(--calendar1-default-primary-color)"
                    filter: ${ CAL1CAL }
                  - entity: calendar.160294bpl_gmail_com
                    name: Priya
                    color: "var(--calendar2-default-primary-color)"
                    filter: ${ CAL2CAL }
                days: ${ DAYS }
                startingDay: ${ STARTDAY }
                showNavigation: true
                showWeekDayText: false # <--- Requires week-planner-card v1.13.0 or higher
                startingDayOffset: 0
                hideWeekend: false
                noCardBackground: false
                compact: false
                weather:
                  showCondition: true
                  showTemperature: true
                  showLowTemperature: true
                  useTwiceDaily: false
                  entity: weather.forecast_home
                locale: en
                showLocation: true
                hidePastEvents: false
                hideDaysWithoutEvents: false
                hideTodayWithoutEvents: false
                combineSimilarEvents: true
                showLegend: false
                legendToggle: false
                card_mod:
                  style: |
                      /* === BASE SAFETY === */
                      :host {
                        overflow: hidden;
                      }

                      /* === CARD BASE === */
                      ha-card {
                        background: rgba(20, 20, 26, 0.75) !important;
                        border-radius: 24px !important;
                        box-shadow: none !important;
                        height: clamp(480px, 70vh, 900px) !important;
                        max-height: clamp(480px, 70vh, 900px) !important;
                      }

                      /* === GRID LAYOUT === */
                      .container {
                        display: grid !important;
                        grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
                        grid-auto-flow: row dense !important;
                        gap: 0 !important;
                      }

                      /* Today/Tomorrow views render only 1-2 .day cells, but the
                         header/navigation row spans "1 / -1" across whatever column
                         count is declared above, which stops auto-fit from collapsing
                         the unused columns (they're not "empty" - the spanning header
                         occupies them). So instead of relying on auto-fit, explicitly
                         redeclare the column count based on how many .day cells the
                         card actually rendered. */
                      .container:not(:has(.day ~ .day)) {
                        grid-template-columns: 1fr !important;
                      }
                      .container:has(.day ~ .day):not(:has(.day ~ .day ~ .day)) {
                        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                      }

                      .container .navigation,
                      .container .header {
                        grid-column: 1 / -1 !important;
                      }

                      /* WEEKDAY LABEL CELLS */
                      .day.header {
                        display: block !important;
                        grid-column: auto !important;
                        margin: 0 !important;
                        padding: 0.2em !important;
                        text-align: center !important;
                        box-sizing: border-box !important;
                      }

                      .day.header .date .text {
                        font-weight: 600 !important;
                      }

                      /* === DAY TILES === */
                      .day {
                        border: solid 1px rgba(255, 255, 255, 0.15) !important;
                        padding: 0.2% !important;
                        width: auto !important;
                        min-width: 0 !important;
                        margin: 0 !important;
                        box-sizing: border-box !important;
                        align-self: stretch !important;
                        justify-self: stretch !important;
                        container-type: inline-size !important;
                        container-name: daycell !important;
                      }

                      /* === YOUR ORIGINAL VISUAL RULES === */
                      .event.past {
                        opacity: .2 !important;
                        background-color: gray !important;
                      }

                      .time {
                        color: #e0e0e0 !important;
                        font-size: 0.8em !important;
                      }

                      .event {
                        color: #f0f0f0 !important;
                        line-height: 16px !important;
                        background-color: var(--border-color) !important;
                        border-radius: 10px !important;
                        max-height: 80px !important;
                        overflow: hidden !important;
                        font-size: 1.1em !important;
                      }

                      .none {
                        background-color: transparent !important;
                      }

                      .today .number {
                        border-radius: 5px !important;
                        background-color: orange !important;
                        padding-left: 4px !important;
                        padding-right: 4px !important;
                      }

                      .day .date .text {
                        font-size: 1em !important;
                        font-weight: bold !important;
                      }

                      .day .date .number {
                        font-weight: bold !important;
                        font-size: 3em !important;
                      }

                      /* Weekday colors */
                    
                      /* When showWeekDayText is true */
                      .day[data-weekday="1"] .date .text,
                      .day[data-weekday="2"] .date .text,
                      .day[data-weekday="3"] .date .text,
                      .day[data-weekday="4"] .date .text,
                      .day[data-weekday="5"] .date .text {
                        color: #2e7d32 !important;
                      }

                      .day[data-weekday="6"] .date .text,
                      .day[data-weekday="7"] .date .text {
                        color: #d32f2f !important;
                      }
                      /* When showWeekDayText is false */
                      .container > .day.header .text {
                        color: #2e7d32 !important;
                      }
                      /* Saturday = column 7 */
                      .container > .day.header:nth-of-type(7) .text {
                        color: #d32f2f !important;
                      }
                      /* Sunday = column 8 */
                      .container > .day.header:nth-of-type(8) .text {
                        color: #d32f2f !important;
                      }


                      /* === RESPONSIVE BREAKPOINTS === */
                      @media (max-width: 1024px) {
                        .day .date .number { font-size: 2em !important; }
                        .day .date .text   { font-size: 0.95em !important; }
                      }

                      @media (max-width: 768px) {
                        .day .date .number { font-size: 1.6em !important; }
                        .day .date .text   { font-size: 0.85em !important; }
                        .event { font-size: 0.85em !important; line-height: 1.1em !important; }
                        .time  { font-size: 0.75em !important; }
                      }

                      /* ========================================================= */
                      /* === MOBILE OVERLAP FIX + TWO‑LINE WRAP FOR TITLES ======== */
                      /* ========================================================= */
                      @media (max-width: 480px) {

                        :host {
                          font-size: clamp(10px, 2.6vw, 13px) !important;
                        }

                        /* Condensed headers */
                        .container .header,
                        .container .navigation {
                          padding: 0.25em 0.4em !important;
                        }

                        /* Day tiles tighter */
                        .day {
                          padding: 0.15em !important;
                          min-width: 0 !important;
                        }

                        /* Smaller date numbers */
                        .day .date .number {
                          font-size: clamp(1.1em, 4.5vw, 1.4em) !important;
                          line-height: 1.1 !important;
                        }
                        .day .date .text {
                          font-size: clamp(0.72em, 3.2vw, 0.85em) !important;
                          line-height: 1.1 !important;
                        }

                        /* Event chip reduced */
                        .event {
                          font-size: clamp(0.72em, 2.9vw, 0.85em) !important;
                          line-height: 1.05em !important;
                          padding: 0.25em 0.35em !important;
                          max-height: 62px !important;
                        }

                        .time {
                          font-size: clamp(0.65em, 2.5vw, 0.78em) !important;
                        }

                        /* === TWO-LINE WRAP FOR TITLES === */
                        .event .title,
                        .event .name,
                        .event .summary,
                        .event .location,
                        .event .desc,
                        .event .description {
                          display: -webkit-box !important;
                          -webkit-box-orient: vertical !important;
                          -webkit-line-clamp: 2 !important;   /* <<< Two lines max */
                          overflow: hidden !important;
                          text-overflow: ellipsis !important;
                          white-space: normal !important;
                          line-height: 1.1em !important;
                          max-height: calc(1.1em * 2) !important;
                        }
                      }

                      /* Slightly larger phones / small tablets */
                      @media (min-width: 481px) and (max-width: 768px) {

                        :host {
                          font-size: clamp(11px, 2.2vw, 14px) !important;
                        }

                        .event {
                          max-height: 72px !important;
                        }

                        .event .title,
                        .event .name,
                        .event .summary {
                          display: -webkit-box !important;
                          -webkit-line-clamp: 2 !important;
                          overflow: hidden !important;
                        }
                      }

                      /* === WIDE DAY CELL (Today/Tomorrow views: 1-2 days fill the row) ===
                         Must stay LAST in this stylesheet: it has to win the cascade over
                         the unconditional ".day .date .number { font-size: 3em }" etc.
                         rules above. Both are !important with equal specificity, so with
                         @container earlier in the file the plain rule below always won
                         regardless of whether the container query matched - this was
                         silently broken (verified: container-type/name were set correctly
                         and the .day element WAS >260px wide, but font-size stayed at the
                         narrow-cell 3em) until this block was moved here.
                         The .weather badge keeps the card's own top-right absolute
                         positioning (just made more compact + single-line), since in a
                         wide cell the date number no longer stretches far enough right
                         to collide with it once padded off the edge. */
                      @container daycell (min-width: 260px) {
                        .day .date {
                          display: flex !important;
                          align-items: baseline !important;
                          gap: 0.4em !important;
                          padding: 0.3em 0.5em !important;
                        }
                        .day .date .number {
                          font-size: 5em !important;
                          line-height: 1 !important;
                        }
                        .day .date .text {
                          font-size: 1.4em !important;
                        }
                        .day .weather {
                          position: absolute !important;
                          top: 0.5em !important;
                          right: 0.7em !important;
                          display: flex !important;
                          align-items: center !important;
                          gap: 0.4em !important;
                          width: auto !important;
                        }
                        .day .weather .temperature {
                          display: flex !important;
                          flex-direction: row !important;
                          gap: 0.3em !important;
                          font-size: 1.1em !important;
                          white-space: nowrap !important;
                        }
                        .day .weather .icon img {
                          width: 32px !important;
                          height: 32px !important;
                        }
                        .day .events {
                          padding: 0 0.5em !important;
                        }
                        .day .event {
                          font-size: 1.3em !important;
                          padding: 0.5em 0.7em !important;
                        }
                      }
              grid_options:
                columns: 120
                rows: auto
                showDescription: false
        column_span: 10
      # --- End CALENDAR SECTION (Week Planner Card) ---
      # --- START POPUP SECTION (Hidden) ---
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#addcalendarevent"
                button_type: name
                name: Add Calendar Event
                icon: mdi:calendar-plus
                show_icon: true
                show_name: true
                styles: |
                  .bubble-button-card-container {
                    background:
                    ${hass.states['input_select.calendar_select'].state == 'Satty' ? 'var(--calendar1-default-primary-color)'
                    : hass.states['input_select.calendar_select'].state == 'Priya' ? 'var(--calendar2-default-primary-color)'
                    : 'gray'} !important;
                  }
              - type: vertical-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_select.calendar_select
                      - entity: input_text.calendar_event_title
                        name: Event Title
                      - entity: input_text.calendar_event_description
                        name: Event Description
                      - entity: input_boolean.calendar_all_day_event
                        name: All Day Event
                    title: Add Calendar Event
                    state_color: false
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: "off"
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_event_start
                          name: Start Time
                        - entity: input_datetime.calendar_event_end
                          name: End Time
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: "on"
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_day_event_start
                          name: Event Start Date
                        - entity: input_datetime.calendar_day_event_end
                          name: Event End Date
                  - type: custom:button-card
                    name: Add Event to Calendar
                    tap_action:
                      action: call-service
                      service: script.add_google_calendar_event
                    styles:
                      card:
                        - background-color: |
                            [[[
                              if (states['input_select.calendar_select'].state == 'Satty') return "var(--calendar1-default-primary-color)";
                              if (states['input_select.calendar_select'].state == 'Priya') return "var(--calendar2-default-primary-color)";
                              return "gray";
                            ]]]
    cards: []
    icon: mdi:calendar-blank-multiple
    # No background image - plain dark theme background (primary-background-color in themes/skylight.yaml)
  # ==============================================================================
  #  SCREENSAVER VIEW
  #  Not shown as a nav tab (subview: true) - reachable only by direct URL.
  #  Point Fully Kiosk Browser's "Screensaver URL" setting at this view's URL
  #  (Settings -> Screen -> Screensaver), and it'll show after your configured
  #  idle timeout and return to the Family Calendar view on touch.
  # ==============================================================================
  - type: sections
    max_columns: 10
    title: Screensaver
    path: screensaver
    subview: true
    theme: Skylight
    sections:
      - type: grid
        cards:
          - type: custom:better-moment-card
            parentStyle: |
              line-height:normal;
            moment:
              - parentStyle: |
                  font-size:1.8em; text-align:center; margin-top:10px;
                templateRaw: |
                  {{moment format=cccc}}
              - parentStyle: |
                  font-size:2.4em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=LLLL dd, yyyy}}
              - parentStyle: |
                  font-size:8em; text-align:center; font-weight:300; margin-top:10px;
                templateRaw: |
                  {{moment format=HH:mm}}
            grid_options:
              columns: 120
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                }
          - type: custom:weather-card
            entity: weather.forecast_home
            current: true
            details: true
            forecast: false
            grid_options:
              columns: 60
              rows: 5
            card_mod:
              style: |
                ha-card {
                  background: rgba(20, 20, 26, 0.75) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
                }
                :host { --paper-font-common-base_-_font-size: 1.3em; }
          - type: weather-forecast
            show_current: false
            show_forecast: true
            entity: weather.forecast_home
            forecast_type: daily
            name: Weather Forecast
            grid_options:
              columns: 60
              rows: 5
            card_mod:
              style: |
                ha-card {
                  background: rgba(20, 20, 26, 0.75) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
                }
        column_span: 10
    cards: []
    icon: mdi:weather-partly-cloudy
    # No background image - plain dark theme background, matches Family Calendar view