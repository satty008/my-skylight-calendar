views:
  - type: sections
    max_columns: 10
    title: Family Calendar
    path: family-calendar
    theme: Skylight
    sections:
      # --- START HEADER SECTION (Date) ---
      - type: grid
        cards:
          - type: custom:better-moment-card
            parentStyle: |
              line-height:normal;
            moment:
              - parentStyle: |
                  font-size:1em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=cccc}}
              - parentStyle: |
                  font-size:1.5em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=LLLL dd, yyyy}}
              - parentStyle: |
                  font-size:4em;  text-align:center; font-weight:400;
                templateRaw: |
                  {{moment format=HH:mm}}
            grid_options:
              columns: 120
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                }
        column_span: 10
      # --- End HEADER SECTION (Date) ---
      # --- START CONTROLS SECTION (Buttons) ---
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: " "
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: vertical-stack
            cards:
              - type: markdown
                content: <font color="#f5f5f5" size="6">Family Calendar</font>
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: horizontal-stack
            cards:
              # --- BUTTONS (Update entities below) ---
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: person.ram_sambamurthy
                name: Satty
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.calendar1_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.calendar1_calendar_filter'].state === '.*' ? 'light-grey' : 'var(--calendar1-default-primary-color)'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: person.bhavi
                name: Bhavi
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.calendar2_calendar_visible_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.calendar2_calendar_filter'].state === '.*' ? 'light-grey' : 'var(--calendar2-default-primary-color)'} !important;
                  }
            grid_options:
              columns: 25
              rows: auto
          - type: markdown
            content: " "
            card_mod:
              style: |
                ha-card { background: none; box-shadow: none; border: none; }
            grid_options:
              columns: 3
              rows: auto
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Add Event
            icon: mdi:calendar-plus
            tap_action:
              action: navigate
              navigation_path: "#addcalendarevent"
            styles: |
              * { font-size: 1.05em !important; }
              ha-card { --bubble-main-background-color: #393745 !important; width: 300px; }    
              .bubble-icon { --mdc-icon-size: 30px !important; color: snow !important; opacity: 1; }
              .bubble-icon-container { background: #393745 !important; display: flex; }
              .bubble-name { color: snow !important; opacity: 1; display: flex; line-height: 18px; flex-direction: row; justify-content: center; flex-grow: 1; margin: 0 40px 0 0; pointer-events: none; position: relative; overflow: hidden; }
            grid_options:
              columns: 10
              rows: 1
          - type: custom:bubble-card
            card_type: select
            entity: input_select.calendar_view
            show_name: true
            show_state: true
            name: Select View
            show_last_changed: false
            show_attribute: false
        column_span: 10
      # --- End CONTROLS SECTION (Buttons) ---
      # --- START CHORES SECTION (ChoreOps - tap to complete) ---
      # Uses ChoreOps entities directly via button.press, NOT the ChoreOps
      # "Add/Edit Chore" config-flow UI - that UI crashes the frontend on
      # every submit in v1.5.1-beta.3 (confirmed: every attempt threw an
      # uncaught exception and silently discarded the input). Chores were
      # created instead via the choreops.create_chore service (Developer
      # Tools > Actions), which works fine and requires a due_date whenever
      # a recurring frequency is set (used as the recurrence anchor date).
      # To add a new recurring chore: call choreops.create_chore with
      # frequency + due_date + assigned_user_names, then add a button-card
      # entry below pointing at its claim/disapprove button entities
      # (button.<person>_choreops_claim_chore_<chore> /
      #  button.<person>_choreops_disapprove_chore_<chore>).
      - type: grid
        cards:
          - type: markdown
            content: "## Chores"
            card_mod:
              style: |
                ha-card { background: none; box-shadow: none; border: none; }
            grid_options:
              columns: 120
              rows: auto
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: sensor.satty_choreops_chore_status_take_out_trash
                name: Take out trash (Satty)
                show_state: false
                show_icon: true
                icon: |
                  [[[ return states[entity.entity_id].state === 'completed' ? 'mdi:check-circle' : 'mdi:checkbox-blank-circle-outline' ]]]
                tap_action: |
                  [[[
                    // ChoreOps has no per-chore "undo" service (only a global
                    // reset-all-chores service) - disapprove_chore only works
                    // on a pending approval, which auto-approved chores skip
                    // entirely. So a completed chore stays completed until its
                    // own schedule resets it; tapping it again is a no-op
                    // instead of showing an error toast.
                    if (states[entity.entity_id].state === 'completed') {
                      return {action: 'none'};
                    }
                    return {action: 'call-service', service: 'button.press', service_data: {entity_id: 'button.satty_choreops_claim_chore_take_out_trash'}};
                  ]]]
                styles:
                  card:
                    - background-color: rgba(20, 20, 26, 0.75)
                    - border-left: 4px solid var(--calendar1-default-primary-color)
                    - border-radius: 12px
                    - padding: 16px
                  icon:
                    - color: |
                        [[[ return states[entity.entity_id].state === 'completed' ? 'var(--calendar1-default-primary-color)' : 'white' ]]]
                  name:
                    - font-size: 1.1em
                    - text-decoration: |
                        [[[ return states[entity.entity_id].state === 'completed' ? 'line-through' : 'none' ]]]
                    - opacity: |
                        [[[ return states[entity.entity_id].state === 'completed' ? '0.5' : '1' ]]]
                grid_options:
                  columns: 60
                  rows: auto
              - type: custom:button-card
                entity: sensor.bhavi_choreops_chore_status_vacuum_living_room
                name: Vacuum living room (Bhavi)
                show_state: false
                show_icon: true
                icon: |
                  [[[ return states[entity.entity_id].state === 'completed' ? 'mdi:check-circle' : 'mdi:checkbox-blank-circle-outline' ]]]
                tap_action: |
                  [[[
                    if (states[entity.entity_id].state === 'completed') {
                      return {action: 'none'};
                    }
                    return {action: 'call-service', service: 'button.press', service_data: {entity_id: 'button.bhavi_choreops_claim_chore_vacuum_living_room'}};
                  ]]]
                styles:
                  card:
                    - background-color: rgba(20, 20, 26, 0.75)
                    - border-left: 4px solid var(--calendar2-default-primary-color)
                    - border-radius: 12px
                    - padding: 16px
                  icon:
                    - color: |
                        [[[ return states[entity.entity_id].state === 'completed' ? 'var(--calendar2-default-primary-color)' : 'white' ]]]
                  name:
                    - font-size: 1.1em
                    - text-decoration: |
                        [[[ return states[entity.entity_id].state === 'completed' ? 'line-through' : 'none' ]]]
                    - opacity: |
                        [[[ return states[entity.entity_id].state === 'completed' ? '0.5' : '1' ]]]
                grid_options:
                  columns: 60
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
        column_span: 10
      # --- End CHORES SECTION ---
      # --- START CALENDAR SECTION (Week Planner Card) ---
      - type: grid
        cards:
          - type: custom:config-template-card
            entities:
              - input_text.calendar1_calendar_filter
              - input_text.calendar2_calendar_filter
              - input_text.calendar3_calendar_filter
              - input_text.calendar4_calendar_filter
              - input_text.family_calendar_filter
              - input_select.calendar_view
            variables:
              CAL1CAL: states['input_text.calendar1_calendar_filter']?.state
              CAL2CAL: states['input_text.calendar2_calendar_filter']?.state
              CAL3CAL: states['input_text.calendar3_calendar_filter']?.state
              CAL4CAL: states['input_text.calendar4_calendar_filter']?.state
              FAMCAL: states['input_text.family_calendar_filter']?.state
              VIEW: states['input_select.calendar_view']?.state
              STARTDAY: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today') return 'today';
                  if (calendarView === 'Tomorrow') return 'tomorrow';
                  // Fallback (valid values: monday, tuesday, wednesday, thursday, friday, saturday, sunday)
                  return 'monday';
                })()
              DAYS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today') return 1;
                  if (calendarView === 'Tomorrow') return 2;
                  if (calendarView === 'Week') return 7;
                  if (calendarView === 'Biweek') return 14;
                  // else return "month"
                  return "month";
                })()
            card:
              type: custom:week-planner-card
              calendars:
                # --- MAP CALENDARS HERE ---
                - entity: calendar.srnarayanan1989_gmail_com
                  name: Satty
                  color: "var(--calendar1-default-primary-color)"
                  filter: ${ CAL1CAL }
                - entity: calendar.160294bpl_gmail_com
                  name: Bhavi
                  color: "var(--calendar2-default-primary-color)"
                  filter: ${ CAL2CAL }
              days: ${ DAYS }
              startingDay: ${ STARTDAY }
              showNavigation: true
              showWeekDayText: false # <--- Requires week-planner-card v1.13.0 or higher
              startingDayOffset: 0
              hideWeekend: false
              noCardBackground: false
              compact: false
              weather:
                showCondition: true
                showTemperature: true
                showLowTemperature: true
                useTwiceDaily: false
                entity: weather.forecast_home
              locale: en
              showLocation: true
              hidePastEvents: false
              hideDaysWithoutEvents: false
              hideTodayWithoutEvents: false
              combineSimilarEvents: true
              showLegend: false
              legendToggle: false
              card_mod:
                style: |
                    /* === BASE SAFETY === */
                    :host {
                      overflow: hidden;
                    }

                    /* === CARD BASE === */
                    ha-card {
                      background: rgba(20, 20, 26, 0.75) !important;
                      border-radius: 24px !important;
                      box-shadow: none !important;
                      height: clamp(480px, 70vh, 900px) !important;
                      max-height: clamp(480px, 70vh, 900px) !important;
                    }

                    /* === GRID LAYOUT === */
                    .container {
                      display: grid !important;
                      grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
                      grid-auto-flow: row dense !important;
                      gap: 0 !important;
                    }

                    /* Today/Tomorrow views render only 1-2 .day cells, but the
                       header/navigation row spans "1 / -1" across whatever column
                       count is declared above, which stops auto-fit from collapsing
                       the unused columns (they're not "empty" - the spanning header
                       occupies them). So instead of relying on auto-fit, explicitly
                       redeclare the column count based on how many .day cells the
                       card actually rendered. */
                    .container:not(:has(.day ~ .day)) {
                      grid-template-columns: 1fr !important;
                    }
                    .container:has(.day ~ .day):not(:has(.day ~ .day ~ .day)) {
                      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                    }

                    .container .navigation,
                    .container .header {
                      grid-column: 1 / -1 !important;
                    }

                    /* WEEKDAY LABEL CELLS */
                    .day.header {
                      display: block !important;
                      grid-column: auto !important;
                      margin: 0 !important;
                      padding: 0.2em !important;
                      text-align: center !important;
                      box-sizing: border-box !important;
                    }

                    .day.header .date .text {
                      font-weight: 600 !important;
                    }

                    /* === DAY TILES === */
                    .day {
                      border: solid 1px rgba(255, 255, 255, 0.15) !important;
                      padding: 0.2% !important;
                      width: auto !important;
                      min-width: 0 !important;
                      margin: 0 !important;
                      box-sizing: border-box !important;
                      align-self: stretch !important;
                      justify-self: stretch !important;
                      container-type: inline-size !important;
                      container-name: daycell !important;
                    }

                    /* === WIDE DAY CELL (Today/Tomorrow views: 1-2 days fill the row) ===
                       The .weather badge is absolutely positioned top-right by the card
                       itself, which only works when the date number stays small (narrow
                       week-view cells). In a wide cell that number grows large enough to
                       collide with it, so above a width threshold we take the weather
                       block out of flow and lay the header out with flexbox instead. */
                    @container daycell (min-width: 260px) {
                      .day .date {
                        display: flex !important;
                        align-items: baseline !important;
                        gap: 0.4em !important;
                        padding: 0.3em 0.5em !important;
                      }
                      .day .date .number {
                        font-size: 5em !important;
                        line-height: 1 !important;
                      }
                      .day .date .text {
                        font-size: 1.4em !important;
                      }
                      .day .weather {
                        position: static !important;
                        display: flex !important;
                        align-items: center !important;
                        gap: 0.5em !important;
                        margin-left: auto !important;
                        width: auto !important;
                      }
                      .day .weather .temperature {
                        display: flex !important;
                        flex-direction: column !important;
                        font-size: 1.2em !important;
                      }
                      .day .weather .icon img {
                        width: 44px !important;
                        height: 44px !important;
                      }
                      .day .events {
                        padding: 0 0.5em !important;
                      }
                      .day .event {
                        font-size: 1.3em !important;
                        padding: 0.5em 0.7em !important;
                      }
                    }

                    /* === YOUR ORIGINAL VISUAL RULES === */
                    .event.past {
                      opacity: .2 !important;
                      background-color: gray !important;
                    }

                    .time {
                      color: #e0e0e0 !important;
                      font-size: 0.8em !important;
                    }

                    .event {
                      color: #f0f0f0 !important;
                      line-height: 16px !important;
                      background-color: var(--border-color) !important;
                      border-radius: 10px !important;
                      max-height: 80px !important;
                      overflow: hidden !important;
                      font-size: 1.1em !important;
                    }

                    .none {
                      background-color: transparent !important;
                    }

                    .today .number {
                      border-radius: 5px !important;
                      background-color: orange !important;
                      padding-left: 4px !important;
                      padding-right: 4px !important;
                    }

                    .day .date .text {
                      font-size: 1em !important;
                      font-weight: bold !important;
                    }

                    .day .date .number {
                      font-weight: bold !important;
                      font-size: 3em !important;
                    }

                    /* Weekday colors */
                    
                    /* When showWeekDayText is true */
                    .day[data-weekday="1"] .date .text,
                    .day[data-weekday="2"] .date .text,
                    .day[data-weekday="3"] .date .text,
                    .day[data-weekday="4"] .date .text,
                    .day[data-weekday="5"] .date .text {
                      color: #2e7d32 !important;
                    }

                    .day[data-weekday="6"] .date .text,
                    .day[data-weekday="7"] .date .text {
                      color: #d32f2f !important;
                    }
                    /* When showWeekDayText is false */
                    .container > .day.header .text {
                      color: #2e7d32 !important;
                    }
                    /* Saturday = column 7 */
                    .container > .day.header:nth-of-type(7) .text {
                      color: #d32f2f !important;
                    }
                    /* Sunday = column 8 */
                    .container > .day.header:nth-of-type(8) .text {
                      color: #d32f2f !important;
                    }


                    /* === RESPONSIVE BREAKPOINTS === */
                    @media (max-width: 1024px) {
                      .day .date .number { font-size: 2em !important; }
                      .day .date .text   { font-size: 0.95em !important; }
                    }

                    @media (max-width: 768px) {
                      .day .date .number { font-size: 1.6em !important; }
                      .day .date .text   { font-size: 0.85em !important; }
                      .event { font-size: 0.85em !important; line-height: 1.1em !important; }
                      .time  { font-size: 0.75em !important; }
                    }

                    /* ========================================================= */
                    /* === MOBILE OVERLAP FIX + TWO‑LINE WRAP FOR TITLES ======== */
                    /* ========================================================= */
                    @media (max-width: 480px) {

                      :host {
                        font-size: clamp(10px, 2.6vw, 13px) !important;
                      }

                      /* Condensed headers */
                      .container .header,
                      .container .navigation {
                        padding: 0.25em 0.4em !important;
                      }

                      /* Day tiles tighter */
                      .day {
                        padding: 0.15em !important;
                        min-width: 0 !important;
                      }

                      /* Smaller date numbers */
                      .day .date .number {
                        font-size: clamp(1.1em, 4.5vw, 1.4em) !important;
                        line-height: 1.1 !important;
                      }
                      .day .date .text {
                        font-size: clamp(0.72em, 3.2vw, 0.85em) !important;
                        line-height: 1.1 !important;
                      }

                      /* Event chip reduced */
                      .event {
                        font-size: clamp(0.72em, 2.9vw, 0.85em) !important;
                        line-height: 1.05em !important;
                        padding: 0.25em 0.35em !important;
                        max-height: 62px !important;
                      }

                      .time {
                        font-size: clamp(0.65em, 2.5vw, 0.78em) !important;
                      }

                      /* === TWO-LINE WRAP FOR TITLES === */
                      .event .title,
                      .event .name,
                      .event .summary,
                      .event .location,
                      .event .desc,
                      .event .description {
                        display: -webkit-box !important;
                        -webkit-box-orient: vertical !important;
                        -webkit-line-clamp: 2 !important;   /* <<< Two lines max */
                        overflow: hidden !important;
                        text-overflow: ellipsis !important;
                        white-space: normal !important;
                        line-height: 1.1em !important;
                        max-height: calc(1.1em * 2) !important;
                      }
                    }

                    /* Slightly larger phones / small tablets */
                    @media (min-width: 481px) and (max-width: 768px) {

                      :host {
                        font-size: clamp(11px, 2.2vw, 14px) !important;
                      }

                      .event {
                        max-height: 72px !important;
                      }

                      .event .title,
                      .event .name,
                      .event .summary {
                        display: -webkit-box !important;
                        -webkit-line-clamp: 2 !important;
                        overflow: hidden !important;
                      }
                    }
            grid_options:
              columns: 120
              rows: auto
              showDescription: false
        column_span: 10
      # --- End CALENDAR SECTION (Week Planner Card) ---
      # --- START POPUP SECTION (Hidden) ---
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#addcalendarevent"
                button_type: name
                name: Add Calendar Event
                icon: mdi:calendar-plus
                show_icon: true
                show_name: true
                styles: |
                  .bubble-button-card-container {
                    background:
                    ${hass.states['input_select.calendar_select'].state == 'Satty' ? 'var(--calendar1-default-primary-color)'
                    : hass.states['input_select.calendar_select'].state == 'Bhavi' ? 'var(--calendar2-default-primary-color)'
                    : 'gray'} !important;
                  }
              - type: vertical-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_select.calendar_select
                      - entity: input_text.calendar_event_title
                        name: Event Title
                      - entity: input_text.calendar_event_description
                        name: Event Description
                      - entity: input_boolean.calendar_all_day_event
                        name: All Day Event
                    title: Add Calendar Event
                    state_color: false
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: "off"
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_event_start
                          name: Start Time
                        - entity: input_datetime.calendar_event_end
                          name: End Time
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: "on"
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_day_event_start
                          name: Event Start Date
                        - entity: input_datetime.calendar_day_event_end
                          name: Event End Date
                  - type: custom:button-card
                    name: Add Event to Calendar
                    tap_action:
                      action: call-service
                      service: script.add_google_calendar_event
                    styles:
                      card:
                        - background-color: |
                            [[[
                              if (states['input_select.calendar_select'].state == 'Satty') return "var(--calendar1-default-primary-color)";
                              if (states['input_select.calendar_select'].state == 'Bhavi') return "var(--calendar2-default-primary-color)";
                              return "gray";
                            ]]]
    cards: []
    icon: mdi:calendar-blank-multiple
    # No background image - plain dark theme background (primary-background-color in themes/skylight.yaml)
  # ==============================================================================
  #  SCREENSAVER VIEW
  #  Not shown as a nav tab (subview: true) - reachable only by direct URL.
  #  Point Fully Kiosk Browser's "Screensaver URL" setting at this view's URL
  #  (Settings -> Screen -> Screensaver), and it'll show after your configured
  #  idle timeout and return to the Family Calendar view on touch.
  # ==============================================================================
  - type: sections
    max_columns: 10
    title: Screensaver
    path: screensaver
    subview: true
    theme: Skylight
    sections:
      - type: grid
        cards:
          - type: custom:better-moment-card
            parentStyle: |
              line-height:normal;
            moment:
              - parentStyle: |
                  font-size:1.8em; text-align:center; margin-top:10px;
                templateRaw: |
                  {{moment format=cccc}}
              - parentStyle: |
                  font-size:2.4em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=LLLL dd, yyyy}}
              - parentStyle: |
                  font-size:8em; text-align:center; font-weight:300; margin-top:10px;
                templateRaw: |
                  {{moment format=HH:mm}}
            grid_options:
              columns: 120
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                }
          - type: custom:weather-card
            entity: weather.forecast_home
            current: true
            details: true
            forecast: false
            grid_options:
              columns: 60
              rows: 5
            card_mod:
              style: |
                ha-card {
                  background: rgba(20, 20, 26, 0.75) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
                }
                :host { --paper-font-common-base_-_font-size: 1.3em; }
          - type: weather-forecast
            show_current: false
            show_forecast: true
            entity: weather.forecast_home
            forecast_type: daily
            name: Weather Forecast
            grid_options:
              columns: 60
              rows: 5
            card_mod:
              style: |
                ha-card {
                  background: rgba(20, 20, 26, 0.75) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
                }
        column_span: 10
    cards: []
    icon: mdi:weather-partly-cloudy
    # No background image - plain dark theme background, matches Family Calendar view