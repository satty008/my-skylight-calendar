button_card_templates:
  chore_tile:
    show_state: false
    show_icon: false
    name: |
      [[[ return states[entity.entity_id].attributes.chore_name ]]]
    tap_action: |
      [[[
        // "2x/wk"/"2x/mo" chores (custom frequency, interval <=45 days) track
        // completions-this-period via input_text.chore_period_progress instead
        // of ChoreOps' own state, since ChoreOps has no native "N of M this
        // period" concept - completing one just pushes its due_date forward
        // by the interval, cycling its own state back to pending regardless
        // of where we are in our own 2-count. This same block (isMulti/
        // periodType/progressCount/isDone) is intentionally duplicated across
        // tap_action/check/badge/name/card styles below - button-card
        // template fields can't share helper functions with each other.
        const st = states[entity.entity_id];
        const freq = st.attributes.recurring_frequency;
        const interval = st.attributes.custom_frequency_interval;
        const isMulti = freq === 'custom' && interval && interval <= 45;
        const periodType = isMulti ? (interval <= 4 ? 'week' : 'month') : '';
        function isoWeekKey(d) {
          const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
          const day = (dt.getUTCDay() + 6) % 7;
          dt.setUTCDate(dt.getUTCDate() - day + 3);
          const firstThu = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
          const wk = 1 + Math.round(((dt - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
          return `${dt.getUTCFullYear()}-W${String(wk).padStart(2, '0')}`;
        }
        function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
        let progressCount = 0;
        if (isMulti) {
          const raw = states['input_text.chore_period_progress'] ? states['input_text.chore_period_progress'].state : '{}';
          let progress = {};
          try { progress = JSON.parse(raw); } catch (e) {}
          const entry = progress[entity.entity_id];
          const currentKey = periodType === 'week' ? isoWeekKey(new Date()) : monthKey(new Date());
          progressCount = (entry && entry.period === currentKey) ? entry.count : 0;
        }
        const nativeDone = ['claimed', 'approved', 'claimed_in_part', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'].includes(st.state);
        const isDone = isMulti ? (progressCount >= 2) : nativeDone;
        const claimEntity = entity.entity_id.replace('sensor.', 'button.').replace('chore_status', 'claim_chore');
        const disapproveEntity = entity.entity_id.replace('sensor.', 'button.').replace('chore_status', 'disapprove_chore');
        const personName = st.attributes.user_name;
        const choreName = st.attributes.chore_name;
        if (isDone) {
          return {action: 'call-service', service: 'script.chore_undo_funny', service_data: {disapprove_entity_id: disapproveEntity, chore_name: choreName, person_name: personName, is_multi: isMulti, chore_entity_id: entity.entity_id, period_type: periodType}};
        }
        return {action: 'call-service', service: 'script.chore_complete_celebrate', service_data: {claim_entity_id: claimEntity, chore_name: choreName, person_name: personName, is_multi: isMulti, chore_entity_id: entity.entity_id, period_type: periodType}};
      ]]]
    double_tap_action: |
      [[[
        const st = states[entity.entity_id];
        const choreName = st.attributes.chore_name;
        const userName = st.attributes.user_name;
        const otherPerson = userName === 'Satty' ? 'Priya' : 'Satty';
        const closeAction = {action: 'fire-dom-event', browser_mod: {service: 'browser_mod.close_popup', data: {}}};
        const mkBtn = (name, offset) => ({
          type: 'button',
          name: name,
          show_icon: false,
          tap_action: {
            action: 'fire-dom-event',
            browser_mod: {
              service: 'browser_mod.sequence',
              data: {
                sequence: [
                  {service: 'script.chore_postpone_apply', data: {chore_name: choreName, user_name: userName, offset: offset}},
                  {service: 'browser_mod.close_popup', data: {}}
                ]
              }
            }
          }
        });
        const mkReorderBtn = (name, direction) => ({
          type: 'button',
          name: name,
          show_icon: false,
          tap_action: {
            action: 'fire-dom-event',
            browser_mod: {
              service: 'browser_mod.sequence',
              data: {
                sequence: [
                  {service: 'script.chore_reorder', data: {chore_entity: entity.entity_id, direction: direction}},
                  {service: 'browser_mod.refresh', data: {}},
                  {service: 'browser_mod.close_popup', data: {}}
                ]
              }
            }
          }
        });
        return {
          action: 'fire-dom-event',
          browser_mod: {
            service: 'browser_mod.popup',
            data: {
              title: choreName,
              content: {
                type: 'vertical-stack',
                cards: [
                  mkBtn('Tomorrow', 'tomorrow'),
                  mkBtn('Same day next week', 'next_week'),
                  mkBtn('Next month', 'next_month'),
                  {
                    type: 'entities',
                    title: 'Or pick a custom date',
                    entities: [
                      {entity: 'input_datetime.chore_postpone_custom_date', name: 'Custom date'},
                      {
                        type: 'call-service',
                        name: 'Confirm custom date',
                        icon: 'mdi:check',
                        service: 'script.chore_postpone_apply',
                        service_data: {chore_name: choreName, user_name: userName, offset: 'custom'}
                      }
                    ]
                  },
                  {
                    type: 'button',
                    name: 'Move to ' + otherPerson + "'s list",
                    show_icon: false,
                    tap_action: {
                      action: 'fire-dom-event',
                      browser_mod: {
                        service: 'browser_mod.sequence',
                        data: {
                          sequence: [
                            {service: 'choreops.update_chore', data: {name: choreName, assignment_action: 'replace', assigned_user_names: [otherPerson]}},
                            {service: 'browser_mod.refresh', data: {}}
                          ]
                        }
                      }
                    }
                  },
                  mkReorderBtn('Move up in list', 'up'),
                  mkReorderBtn('Move down in list', 'down'),
                  {
                    type: 'button',
                    name: 'Cancel',
                    show_icon: false,
                    tap_action: closeAction
                  }
                ]
              }
            }
          }
        };
      ]]]
    custom_fields:
      icon: |
        [[[
          const st = states[entity.entity_id];
          const n = (st.attributes.chore_name || '').toLowerCase();
          let mdi;
          if (n.includes('dishwasher')) mdi = 'mdi:dishwasher';
          else if (n.includes('laundry') || n.includes('washer') || n.includes('towel')) mdi = 'mdi:washing-machine';
          else if (n.includes('supplement') || n.includes('vitamin')) mdi = 'mdi:pill';
          else if (n.includes('vacuum')) mdi = 'mdi:vacuum-outline';
          else if (n.includes('bathroom') || n.includes('toilet') || n.includes('shower')) mdi = 'mdi:shower';
          else if (n.includes('grocery') || n.includes('shopping')) mdi = 'mdi:cart-outline';
          else if (n.includes('cook') || n.includes('meal') || n.includes('veg') || n.includes('dal')) mdi = 'mdi:pot-steam-outline';
          else if (n.includes('mop')) mdi = 'mdi:broom';
          else if (n.includes('bottle') || n.includes('pfand') || n.includes('recycl')) mdi = 'mdi:bottle-soda-classic-outline';
          else if (n.includes('cupboard') || n.includes('cabinet')) mdi = 'mdi:wardrobe-outline';
          else if (n.includes('trash') || n.includes('unneeded') || n.includes('declutter')) mdi = 'mdi:trash-can-outline';
          else if (n.includes('desk')) mdi = 'mdi:desk';
          else if (n.includes('window')) mdi = 'mdi:window-closed-variant';
          else if (n.includes('door')) mdi = 'mdi:door';
          else if (n.includes('sheet')) mdi = 'mdi:bed-king-outline';
          else if (n.includes('quilt') || n.includes('blanket')) mdi = 'mdi:blanket';
          else if (n.includes('bed') || n.includes('sofa')) mdi = 'mdi:bed-outline';
          else if (n.includes('plant') || n.includes('water')) mdi = 'mdi:flower-outline';
          else if (n.includes('toiletries') || n.includes('checklist')) mdi = 'mdi:format-list-checks';
          else if (n.includes('kitchen') || n.includes('wipe') || n.includes('appliance') || n.includes('counter')) mdi = 'mdi:spray-bottle';
          else mdi = 'mdi:checkbox-marked-circle-outline';
          const personPrefix = entity.entity_id.split('.')[1].split('_choreops_')[0];
          const colorEntity = personPrefix === 'satty' ? 'input_text.satty_color' : 'input_text.bhavi_color';
          const color = states[colorEntity].state;
          const isDone = (() => {
            const freq2 = st.attributes.recurring_frequency;
            const interval2 = st.attributes.custom_frequency_interval;
            const isMulti2 = freq2 === 'custom' && interval2 && interval2 <= 45;
            if (!isMulti2) return ['claimed', 'approved', 'claimed_in_part', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'].includes(st.state);
            const periodType2 = interval2 <= 4 ? 'week' : 'month';
            const raw2 = states['input_text.chore_period_progress'] ? states['input_text.chore_period_progress'].state : '{}';
            let progress2 = {};
            try { progress2 = JSON.parse(raw2); } catch (e) {}
            const entry2 = progress2[entity.entity_id];
            const d2 = new Date();
            let currentKey2;
            if (periodType2 === 'week') {
              const dt2 = new Date(Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate()));
              const day2 = (dt2.getUTCDay() + 6) % 7;
              dt2.setUTCDate(dt2.getUTCDate() - day2 + 3);
              const firstThu2 = new Date(Date.UTC(dt2.getUTCFullYear(), 0, 4));
              const wk2 = 1 + Math.round(((dt2 - firstThu2) / 86400000 - 3 + ((firstThu2.getUTCDay() + 6) % 7)) / 7);
              currentKey2 = `${dt2.getUTCFullYear()}-W${String(wk2).padStart(2, '0')}`;
            } else {
              currentKey2 = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, '0')}`;
            }
            const count2 = (entry2 && entry2.period === currentKey2) ? entry2.count : 0;
            return count2 >= 2;
          })();
          // A gentle breathe+wiggle on the icon badge for anything still
          // pending, so the board reads as "alive" rather than a static
          // list - done chores settle (no animation) to visually read as
          // resolved. Delay is derived from the chore name so identical
          // chores in different columns don't all pulse in lockstep.
          let hash = 0;
          for (const ch of (st.attributes.chore_name || '')) hash = (hash * 31 + ch.charCodeAt(0)) % 1000;
          const delay = (hash / 1000 * 2.6).toFixed(2);
          const anim = isDone ? 'none' : `choreBreathe 3.4s ease-in-out ${delay}s infinite`;
          return `<style>@keyframes choreBreathe { 0%, 100% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.05) rotate(-4deg); } 50% { transform: scale(1.1) rotate(0deg); box-shadow: 0 0 10px 1px ${color}66; } 75% { transform: scale(1.05) rotate(4deg); } }</style>
          <div style="width:40px;height:40px;border-radius:12px;background:${color}33;display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:${anim};">
            <ha-icon icon="${mdi}" style="width:22px;height:22px;color:${color};"></ha-icon>
          </div>`;
        ]]]
      meta: |
        [[[
          const st = states[entity.entity_id];
          const f = st.attributes.recurring_frequency;
          const interval = st.attributes.custom_frequency_interval;
          const unit = st.attributes.custom_frequency_unit;
          let freqLabel;
          if (f === 'daily') freqLabel = 'Daily';
          else if (f === 'week_end') freqLabel = 'Weekly';
          else if (f === 'month_end') freqLabel = 'Monthly';
          else if (f === 'quarter_end') freqLabel = '3mo';
          else if (f === 'custom' && unit === 'days' && interval <= 4) freqLabel = '2x/wk';
          else if (f === 'custom' && unit === 'days' && interval <= 20) freqLabel = '2x/mo';
          else freqLabel = f || '';
          const freqPill = `<span style="display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.65);font-size:0.65em;font-weight:600;white-space:nowrap;">${freqLabel}</span>`;

          const due = st.attributes.due_date;
          const isDone = (() => {
            const freq2 = st.attributes.recurring_frequency;
            const interval2 = st.attributes.custom_frequency_interval;
            const isMulti2 = freq2 === 'custom' && interval2 && interval2 <= 45;
            if (!isMulti2) return ['claimed', 'approved', 'claimed_in_part', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'].includes(st.state);
            const periodType2 = interval2 <= 4 ? 'week' : 'month';
            const raw2 = states['input_text.chore_period_progress'] ? states['input_text.chore_period_progress'].state : '{}';
            let progress2 = {};
            try { progress2 = JSON.parse(raw2); } catch (e) {}
            const entry2 = progress2[entity.entity_id];
            const d2 = new Date();
            let currentKey2;
            if (periodType2 === 'week') {
              const dt2 = new Date(Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate()));
              const day2 = (dt2.getUTCDay() + 6) % 7;
              dt2.setUTCDate(dt2.getUTCDate() - day2 + 3);
              const firstThu2 = new Date(Date.UTC(dt2.getUTCFullYear(), 0, 4));
              const wk2 = 1 + Math.round(((dt2 - firstThu2) / 86400000 - 3 + ((firstThu2.getUTCDay() + 6) % 7)) / 7);
              currentKey2 = `${dt2.getUTCFullYear()}-W${String(wk2).padStart(2, '0')}`;
            } else {
              currentKey2 = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, '0')}`;
            }
            const count2 = (entry2 && entry2.period === currentKey2) ? entry2.count : 0;
            return count2 >= 2;
          })();
          let label, bg;
          if (isDone) {
            label = 'Done'; bg = '#238636';
          } else if (!due) {
            label = 'Open'; bg = '#57606a';
          } else {
            const dueD = new Date(due);
            const dueMid = new Date(dueD.getFullYear(), dueD.getMonth(), dueD.getDate());
            const t = new Date();
            const todayMid = new Date(t.getFullYear(), t.getMonth(), t.getDate());
            const diffDays = Math.round((dueMid - todayMid) / 86400000);
            const shortDate = dueD.toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
            const lastDayOfMonth = new Date(dueD.getFullYear(), dueD.getMonth() + 1, 0).getDate();
            const isMonthEnd = dueD.getDate() === lastDayOfMonth;
            const dayOfWeek = todayMid.getDay();
            const daysUntilThisWeekEnd = (7 - dayOfWeek) % 7;
            const daysUntilNextWeekEnd = daysUntilThisWeekEnd + 7;
            if (diffDays < 0) {
              label = `Overdue · ${shortDate} (${Math.abs(diffDays)}d)`; bg = '#da3633';
            } else if (diffDays === 0) {
              label = 'Due today'; bg = '#9a6700';
            } else if (diffDays === 1) {
              label = 'Due tomorrow'; bg = '#9a6700';
            } else if (isMonthEnd) {
              label = `Month end · ${shortDate} (${diffDays}d)`; bg = '#57606a';
            } else if (diffDays <= daysUntilThisWeekEnd) {
              label = `This week · ${shortDate} (${diffDays}d)`; bg = '#9a6700';
            } else if (diffDays <= daysUntilNextWeekEnd) {
              label = `Next week · ${shortDate} (${diffDays}d)`; bg = '#57606a';
            } else {
              label = `Due ${shortDate} (${diffDays}d)`; bg = '#57606a';
            }
          }
          const duePill = `<span style="display:inline-block;padding:2px 10px;border-radius:999px;background:${bg};color:#fff;font-size:0.72em;font-weight:700;white-space:nowrap;">${label}</span>`;
          return `<div style="display:flex;gap:6px;align-items:center;">${freqPill}${duePill}</div>`;
        ]]]
      check: |
        [[[
          const st = states[entity.entity_id];
          const freq = st.attributes.recurring_frequency;
          const interval = st.attributes.custom_frequency_interval;
          const isMulti = freq === 'custom' && interval && interval <= 45;
          const periodType = isMulti ? (interval <= 4 ? 'week' : 'month') : '';
          function isoWeekKey(d) {
            const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const day = (dt.getUTCDay() + 6) % 7;
            dt.setUTCDate(dt.getUTCDate() - day + 3);
            const firstThu = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
            const wk = 1 + Math.round(((dt - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
            return `${dt.getUTCFullYear()}-W${String(wk).padStart(2, '0')}`;
          }
          function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
          let progressCount = 0;
          if (isMulti) {
            const raw = states['input_text.chore_period_progress'] ? states['input_text.chore_period_progress'].state : '{}';
            let progress = {};
            try { progress = JSON.parse(raw); } catch (e) {}
            const entry = progress[entity.entity_id];
            const currentKey = periodType === 'week' ? isoWeekKey(new Date()) : monthKey(new Date());
            progressCount = (entry && entry.period === currentKey) ? entry.count : 0;
          }
          if (isMulti) {
            // Two small circles instead of one big one - filled left-to-right
            // as progressCount rises from 0 to 2 this period.
            const dot = (filled) => `<ha-icon icon="${filled ? 'mdi:circle' : 'mdi:circle-outline'}" style="width:13px;height:13px;color:${filled ? '#3fb950' : 'rgba(255,255,255,0.3)'};"></ha-icon>`;
            return `<div style="display:flex;flex-direction:column;gap:2px;align-items:center;">${dot(progressCount >= 1)}${dot(progressCount >= 2)}</div>`;
          }
          const nativeDone = ['claimed', 'approved', 'claimed_in_part', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'].includes(st.state);
          return nativeDone
            ? '<ha-icon icon="mdi:check-circle" style="width:26px;height:26px;color:#3fb950;"></ha-icon>'
            : '<ha-icon icon="mdi:checkbox-blank-circle-outline" style="width:26px;height:26px;color:rgba(255,255,255,0.3);"></ha-icon>';
        ]]]
    styles:
      card:
        - background-color: |
            [[[
              const st = states[entity.entity_id];
              const isDone = (() => {
                const freq2 = st.attributes.recurring_frequency;
                const interval2 = st.attributes.custom_frequency_interval;
                const isMulti2 = freq2 === 'custom' && interval2 && interval2 <= 45;
                if (!isMulti2) return ['claimed', 'approved', 'claimed_in_part', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'].includes(st.state);
                const periodType2 = interval2 <= 4 ? 'week' : 'month';
                const raw2 = states['input_text.chore_period_progress'] ? states['input_text.chore_period_progress'].state : '{}';
                let progress2 = {};
                try { progress2 = JSON.parse(raw2); } catch (e) {}
                const entry2 = progress2[entity.entity_id];
                const d2 = new Date();
                let currentKey2;
                if (periodType2 === 'week') {
                  const dt2 = new Date(Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate()));
                  const day2 = (dt2.getUTCDay() + 6) % 7;
                  dt2.setUTCDate(dt2.getUTCDate() - day2 + 3);
                  const firstThu2 = new Date(Date.UTC(dt2.getUTCFullYear(), 0, 4));
                  const wk2 = 1 + Math.round(((dt2 - firstThu2) / 86400000 - 3 + ((firstThu2.getUTCDay() + 6) % 7)) / 7);
                  currentKey2 = `${dt2.getUTCFullYear()}-W${String(wk2).padStart(2, '0')}`;
                } else {
                  currentKey2 = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, '0')}`;
                }
                const count2 = (entry2 && entry2.period === currentKey2) ? entry2.count : 0;
                return count2 >= 2;
              })();
              const personPrefix = entity.entity_id.split('.')[1].split('_choreops_')[0];
              const colorEntity = personPrefix === 'satty' ? 'input_text.satty_color' : 'input_text.bhavi_color';
              const color = states[colorEntity].state;
              return isDone ? color + '26' : 'rgba(20, 20, 26, 0.75)';
            ]]]
        - border-left: |
            [[[
              const personPrefix = entity.entity_id.split('.')[1].split('_choreops_')[0];
              const colorEntity = personPrefix === 'satty' ? 'input_text.satty_color' : 'input_text.bhavi_color';
              return '4px solid ' + states[colorEntity].state;
            ]]]
        - border-radius: 12px
        - padding: 8px 12px 8px 8px
        - margin-bottom: 6px
        - display: |
            [[[
              const st = states[entity.entity_id];
              const freq = st.attributes.recurring_frequency;
              const due = st.attributes.due_date;
              const view = states['input_select.calendar_view'] ? states['input_select.calendar_view'].state : 'Today';
              const viewDays = {Today: 0, Tomorrow: 1, Week: 7, Biweek: 14, Month: 30}[view] ?? 0;
              const windowEnd = new Date();
              windowEnd.setDate(windowEnd.getDate() + viewDays);
              const windowEndStr = windowEnd.getFullYear() + '-' + String(windowEnd.getMonth() + 1).padStart(2, '0') + '-' + String(windowEnd.getDate()).padStart(2, '0');
              const visible = freq === 'daily' || (due && due.slice(0, 10) <= windowEndStr);
              return visible ? 'grid' : 'none';
            ]]]
        - grid-template-columns: 1fr
      grid:
        - grid-template-areas: '"icon n check" "icon meta check"'
        - grid-template-columns: 48px 1fr 34px
        - grid-template-rows: auto auto
        - width: 100%
        - justify-content: stretch
        - align-items: center
        - column-gap: 10px
        - row-gap: 3px
      custom_fields:
        icon:
          - grid-area: icon
          - justify-self: start
          - align-self: center
        meta:
          - grid-area: meta
          - justify-self: start
          - align-self: center
        check:
          - grid-area: check
          - justify-self: center
          - align-self: center
      name:
        - grid-area: n
        - justify-self: start
        - align-self: end
        - font-size: 1.05em
        - font-weight: 600
        # button-card's default name styling truncates with an ellipsis at
        # any width narrower than the full chore name - overridden here so
        # long names wrap to a second line instead (the "n" grid row is
        # already `auto`-sized, so it grows to fit without extra config).
        - white-space: normal
        - overflow: visible
        - text-overflow: clip
        - line-height: 1.2
        - text-decoration: |
            [[[
              const st = states[entity.entity_id];
              const freq2 = st.attributes.recurring_frequency;
              const interval2 = st.attributes.custom_frequency_interval;
              const isMulti2 = freq2 === 'custom' && interval2 && interval2 <= 45;
              let isDone;
              if (!isMulti2) {
                isDone = ['claimed', 'approved', 'claimed_in_part', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'].includes(st.state);
              } else {
                const periodType2 = interval2 <= 4 ? 'week' : 'month';
                const raw2 = states['input_text.chore_period_progress'] ? states['input_text.chore_period_progress'].state : '{}';
                let progress2 = {};
                try { progress2 = JSON.parse(raw2); } catch (e) {}
                const entry2 = progress2[entity.entity_id];
                const d2 = new Date();
                let currentKey2;
                if (periodType2 === 'week') {
                  const dt2 = new Date(Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate()));
                  const day2 = (dt2.getUTCDay() + 6) % 7;
                  dt2.setUTCDate(dt2.getUTCDate() - day2 + 3);
                  const firstThu2 = new Date(Date.UTC(dt2.getUTCFullYear(), 0, 4));
                  const wk2 = 1 + Math.round(((dt2 - firstThu2) / 86400000 - 3 + ((firstThu2.getUTCDay() + 6) % 7)) / 7);
                  currentKey2 = `${dt2.getUTCFullYear()}-W${String(wk2).padStart(2, '0')}`;
                } else {
                  currentKey2 = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, '0')}`;
                }
                const count2 = (entry2 && entry2.period === currentKey2) ? entry2.count : 0;
                isDone = count2 >= 2;
              }
              return isDone ? 'line-through' : 'none';
            ]]]
        - opacity: |
            [[[
              const st = states[entity.entity_id];
              const freq2 = st.attributes.recurring_frequency;
              const interval2 = st.attributes.custom_frequency_interval;
              const isMulti2 = freq2 === 'custom' && interval2 && interval2 <= 45;
              let isDone;
              if (!isMulti2) {
                isDone = ['claimed', 'approved', 'claimed_in_part', 'approved_in_part', 'completed', 'completed_in_part', 'completed_by_other'].includes(st.state);
              } else {
                const periodType2 = interval2 <= 4 ? 'week' : 'month';
                const raw2 = states['input_text.chore_period_progress'] ? states['input_text.chore_period_progress'].state : '{}';
                let progress2 = {};
                try { progress2 = JSON.parse(raw2); } catch (e) {}
                const entry2 = progress2[entity.entity_id];
                const d2 = new Date();
                let currentKey2;
                if (periodType2 === 'week') {
                  const dt2 = new Date(Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate()));
                  const day2 = (dt2.getUTCDay() + 6) % 7;
                  dt2.setUTCDate(dt2.getUTCDate() - day2 + 3);
                  const firstThu2 = new Date(Date.UTC(dt2.getUTCFullYear(), 0, 4));
                  const wk2 = 1 + Math.round(((dt2 - firstThu2) / 86400000 - 3 + ((firstThu2.getUTCDay() + 6) % 7)) / 7);
                  currentKey2 = `${dt2.getUTCFullYear()}-W${String(wk2).padStart(2, '0')}`;
                } else {
                  currentKey2 = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, '0')}`;
                }
                const count2 = (entry2 && entry2.period === currentKey2) ? entry2.count : 0;
                isDone = count2 >= 2;
              }
              return isDone ? '0.6' : '1';
            ]]]
views:
  - type: sections
    max_columns: 10
    title: Family Calendar
    path: family-calendar
    theme: Skylight
    sections:
      # --- START TOP SECTION (Forecast | Date/Time | Controls) ---
      # Split into 3 separate sections (not one section containing a
      # horizontal-stack of 3 items) specifically so this row is responsive.
      # A horizontal-stack's own flex layout (#root, flex-direction:row,
      # flex-wrap:nowrap) lives inside ITS shadow root and is NOT reachable
      # via card_mod - confirmed via adoptedStyleSheets that no custom style
      # sheet is ever injected there, in this card-mod/HA version. Home
      # Assistant's sections VIEW, on the other hand, genuinely does
      # responsive reflow (sections wrap to their own row below a viewport
      # width HA computes internally) - so each part gets its own section
      # here, sized to fill one row on a wide screen (3+4+3 of
      # max_columns: 10) and to stack full-width on a narrow one.
      - type: grid
        cards:
          - type: horizontal-stack
            card_mod:
              style: |
                .card { margin-right: auto !important; }
            cards:
              - type: weather-forecast
                entity: weather.forecast_home
                forecast_type: hourly
                show_current: false
                show_forecast: true
                card_mod:
                  style: |
                    ha-card { zoom: 0.55 !important; max-width: 280px !important; background: rgba(20, 20, 26, 0.75) !important; border: solid 1px rgba(255, 255, 255, 0.15) !important; border-right: none !important; border-radius: 24px 0 0 24px !important; box-shadow: none !important; padding: 0.25em 0.5em !important; box-sizing: border-box !important; }
                    @media (max-width: 700px) {
                      ha-card { zoom: 0.65 !important; max-width: 40vw !important; }
                    }
                    /* .forecast-image-icon wraps each hour's condition SVG -
                       a real, stable selector confirmed live (weather-forecast
                       is a leaf card, card_mod reliably injects into its shadow
                       root, unlike stack cards elsewhere in this file). Each
                       icon gets its own float phase via nth-child so the row
                       bobs like a little wave instead of moving in lockstep. */
                    .forecast-image-icon { animation: forecastFloat 3.2s ease-in-out infinite; }
                    .forecast-image-icon:nth-of-type(5n+1) { animation-delay: 0s; }
                    .forecast-image-icon:nth-of-type(5n+2) { animation-delay: 0.25s; }
                    .forecast-image-icon:nth-of-type(5n+3) { animation-delay: 0.5s; }
                    .forecast-image-icon:nth-of-type(5n+4) { animation-delay: 0.75s; }
                    .forecast-image-icon:nth-of-type(5n+5) { animation-delay: 1s; }
                    @keyframes forecastFloat {
                      0%, 100% { transform: translateY(0) scale(1); }
                      50% { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 2px 3px rgba(255,200,80,0.5)); }
                    }
              - type: weather-forecast
                entity: weather.forecast_home
                forecast_type: daily
                show_current: false
                show_forecast: true
                card_mod:
                  style: |
                    ha-card { zoom: 0.55 !important; max-width: 280px !important; background: rgba(20, 20, 26, 0.75) !important; border: solid 1px rgba(255, 255, 255, 0.15) !important; border-left: solid 1px rgba(255,255,255,0.25) !important; border-radius: 0 24px 24px 0 !important; box-shadow: none !important; padding: 0.25em 0.5em !important; box-sizing: border-box !important; }
                    @media (max-width: 700px) {
                      ha-card { zoom: 0.65 !important; max-width: 40vw !important; }
                    }
                    .forecast-image-icon { animation: forecastFloatDaily 3.2s ease-in-out infinite; }
                    .forecast-image-icon:nth-of-type(5n+1) { animation-delay: 0s; }
                    .forecast-image-icon:nth-of-type(5n+2) { animation-delay: 0.25s; }
                    .forecast-image-icon:nth-of-type(5n+3) { animation-delay: 0.5s; }
                    .forecast-image-icon:nth-of-type(5n+4) { animation-delay: 0.75s; }
                    .forecast-image-icon:nth-of-type(5n+5) { animation-delay: 1s; }
                    @keyframes forecastFloatDaily {
                      0%, 100% { transform: translateY(0) scale(1); }
                      50% { transform: translateY(-4px) scale(1.1); filter: drop-shadow(0 2px 3px rgba(255,200,80,0.5)); }
                    }
        column_span: 1
      - type: grid
        cards:
          - type: markdown
            # ha-markdown-element strips BOTH style="..." and class="..."
            # attributes via DOMPurify (confirmed via getComputedStyle - class
            # ended up "" on every rendered node even though the source markdown
            # had class="..."). ha-icon's icon="..." attribute does survive.
            # Styled entirely with structural/positional selectors below instead.
            # card_mod must ALSO pierce ha-markdown's own nested shadow root via
            # the "ha-markdown$:" key - a plain top-level `style: |` string lands
            # one shadow boundary too shallow.
            content: |
              {% set known_conditions = ['sunny','clear-night','cloudy','partlycloudy','rainy','pouring','snowy','snowy-rainy','fog','windy','windy-variant','hail','lightning','lightning-rainy','exceptional'] %}
              {% set condition = states('weather.forecast_home') %}
              {% set icon_file = condition if condition in known_conditions else 'cloudy' %}
              <div>
                <div>
                  <img src="/local/weather-icons/{{ icon_file }}.svg">
                  <span>{{ state_attr('weather.forecast_home','temperature') }}{{ state_attr('weather.forecast_home','temperature_unit') }}</span>
                </div>
                <div>
                  <span>{{ now().strftime('%H:%M') }}</span>
                </div>
              </div>
              <div>
                <span>{{ now().day }}</span>
                <span>{{ now().strftime('%A') }}</span>
              </div>
              <div>
                <span>{{ now().strftime('%B %Y') }}</span>
              </div>
            card_mod:
              style:
                ".": |
                  ha-card { background: none !important; box-shadow: none !important; border: none !important; padding: 0.2em 0.2em 0.3em 0.2em !important; }
                ha-markdown$: |
                  /* Illustrated, self-animating (embedded SMIL) SVGs from the
                     open-source Meteocons set (MIT, github.com/basmilius/weather-
                     icons) - hosted locally under www/weather-icons/ (served at
                     /local/weather-icons/) rather than relying on their CDN, since
                     the animation is baked into each file and plays natively via
                     <img src>, unaffected by ha-markdown-element's DOMPurify pass
                     (which strips style/class but leaves src alone - same reason
                     the profile-photo badges work).
                     Centered as a block within its column (was left-aligned when
                     this sat alone above the chores box) - each row's own
                     justify-content changed to center, plus centering the whole
                     markdown-element as a column. nth-child selectors target
                     ha-markdown-element's three direct <div> children, since
                     class/style attrs don't survive DOMPurify either. */
                  ha-markdown-element { display: flex !important; flex-direction: column !important; align-items: center !important; }
                  ha-markdown-element > div:nth-child(1) { display: flex !important; align-items: center !important; justify-content: center !important; gap: 1.1em !important; }
                  ha-markdown-element > div:nth-child(1) > div:first-child { display: flex !important; align-items: center !important; gap: 0.4em !important; }
                  ha-markdown-element > div:nth-child(1) > div:first-child > img { width: 46px !important; height: 46px !important; animation: bigIconFloat 4s ease-in-out infinite !important; transform-origin: center bottom !important; }
                  @keyframes bigIconFloat {
                    0%, 100% { transform: translateY(0) rotate(0deg); }
                    30% { transform: translateY(-5px) rotate(-4deg); }
                    60% { transform: translateY(-2px) rotate(3deg); }
                  }
                  ha-markdown-element > div:nth-child(1) > div:first-child > span { font-size: 1.3em !important; }
                  ha-markdown-element > div:nth-child(1) > div:last-child > span { font-size: 2.1em !important; font-weight: 700 !important; display: inline-block !important; animation: headertimepulse 2.4s ease-in-out infinite !important; }
                  @keyframes headertimepulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
                  ha-markdown-element > div:nth-child(2) { display: flex !important; align-items: baseline !important; justify-content: center !important; gap: 0.5em !important; margin-top: 0.25em !important; }
                  ha-markdown-element > div:nth-child(2) > span:first-child {
                    font-size: 2.3em !important; font-weight: bold !important; line-height: 1 !important;
                    background: linear-gradient(110deg, orange 30%, #ffd873 45%, orange 60%) !important;
                    background-size: 220% 100% !important;
                    animation: tempShimmer 3.6s ease-in-out infinite !important;
                    color: #1a1a1a !important; border-radius: 8px !important; padding: 0 0.2em !important;
                  }
                  @keyframes tempShimmer {
                    0% { background-position: 200% 0; }
                    100% { background-position: -20% 0; }
                  }
                  ha-markdown-element > div:nth-child(2) > span:last-child { font-size: 1.2em !important; font-weight: 600 !important; }
                  ha-markdown-element > div:nth-child(3) { font-size: 0.9em !important; opacity: 0.65 !important; margin-top: 0.15em !important; text-align: center !important; }
        column_span: 1
