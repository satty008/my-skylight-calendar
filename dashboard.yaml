                            opacity: 1 !important;
                            background-color: ${hass.states['input_text.calendar1_calendar_filter'].state === '.*' ? 'var(--calendar1-default-primary-color)' : 'light-grey'} !important;
                          }
                      - type: conditional
                        conditions:
                          - condition: state
                            entity: input_text.calendar1_calendar_filter
                            state: ".*"
                        card:
                          type: vertical-stack
                          cards:
