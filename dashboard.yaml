                                name: Take out trash
                                show_state: false
                                show_icon: true
                                icon: |
                                  [[[ return states[entity.entity_id].state === 'completed' ? 'mdi:check-circle' : 'mdi:checkbox-blank-circle-outline' ]]]
                                tap_action: |
                                  [[[
                                    if (states[entity.entity_id].state === 'completed') {
                                      return {action: 'none'};
                                    }
                                    return {action: 'call-service', service: 'button.press', service_data: {entity_id: 'button.satty_choreops_claim_chore_take_out_trash'}};
                                  ]]]
                                custom_fields:
                                  photo: |
                                    [[[ return `<img src="${states['person.ram_sambamurthy'].attributes.entity_picture}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;display:block;">` ]]]
                                styles:
                                  card:
                                    - background-color: rgba(20, 20, 26, 0.75)
                                    - border-left: 4px solid var(--calendar1-default-primary-color)
                                    - border-radius: 8px
                                    - padding: 6px 10px
                                    - margin-bottom: 6px
                                    - display: grid
                                  grid:
                                    # button-card auto-assigns each custom_fields entry's grid-area name
                                    # to match its KEY ("photo"), NOT a name set under styles.custom_fields
                                    # - an earlier version used a short "p" token here that never matched,
                                    # so the photo fell out of the template into an unplaced implicit
                                    # column (confirmed via computed style: the img's grid-area was
                                    # "photo" while this template only defined "p", so it landed wherever
                                    # the browser felt like putting an unplaced item - visually on the
                                    # right). Using "photo" as the literal token fixes the placement.
