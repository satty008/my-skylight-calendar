# ==============================================================================
#  FAMILY CALENDAR BACKEND PACKAGE
# ==============================================================================
#  INSTRUCTIONS:
#  1. Place this file in your /config/packages/ folder.
#  2. Ensure your configuration.yaml has: 
#     homeassistant:
#       packages: !include_dir_named packages
#  3. RESTART Home Assistant.
# ==============================================================================

# 1. HELPERS (The Variables)
input_text:
  # Tracks how many times each "2x/wk"/"2x/mo" chore has been completed
  # within its CURRENT period. ChoreOps itself has no such counter (its
  # chore_completed_count etc are all-time totals, and completing a
  # custom-interval chore just pushes due_date forward by the interval -
  # there's no native "1 of 2 this week" concept). JSON blob keyed by
  # chore sensor entity_id: {"<entity_id>": {"count": N, "period": "<key>"}}.
  # "period" is an ISO week ("2026-W33") or year-month ("2026-08") string -
  # a stored entry for a past period is treated as count 0 by both the
  # reader (chore_tile's JS) and writer (chore_progress_track script)
  # rather than needing a scheduled reset automation.
  chore_period_progress:
    name: Chore Period Progress
    initial: "{}"
    max: 5000
  # Filter Toggles (RegEx: .* = Show, ^$ = Hide)
  calendar1_calendar_filter:
    name: calendar1 Filter
    initial: ".*"
  calendar2_calendar_filter:
    name: calendar2 Filter
    initial: ".*"
  calendar3_calendar_filter:
    name: calendar3 Filter
    initial: ".*"
  calendar4_calendar_filter:
    name: calendar4 Filter
    initial: ".*"
  family_calendar_filter:
    name: Family Filter
    initial: ".*"
  birthdays_calendar_filter:
    name: Birthdays Filter
    initial: ".*"
  holidays_calendar_filter:
    name: Holidays Filter
    initial: ".*"

  # Event Form Data
  calendar_event_title:
    name: Event Title
    icon: mdi:format-title
  calendar_event_description:
    name: Event Description
    icon: mdi:text

  # Per-person accent color (hex), cycled by the "recycle" button next to
  # each name on the Family Calendar dashboard. Drives the color of that
  # person's name pill and every one of their chore tiles (border +
  # profile-photo ring) - see cycle_satty_color/cycle_bhavi_color below.
  # Initial values match the calendar1/2-default-primary-color theme vars
  # (themes/skylight.yaml) so the starting look is unchanged.
  satty_color:
    name: Satty Color
    initial: "#fb8072"
  bhavi_color:
    name: Priya Color
    initial: "#fdbf6f"

input_select:
  # The dropdown list for "Who is this event for?"
  calendar_select:
    name: Select Calendar
    options:
      - Satty
      - Priya
    icon: mdi:calendar-check
  
  # The View selector (Week, Month, etc)
  calendar_view:
    name: Calendar View
    options:
      - Today
      - Tomorrow
      - Week
      - Biweek
      - Month
    initial: Week

input_datetime:
  # Event start/end times
  calendar_event_start:
    has_date: true
    has_time: true
  calendar_event_end:
    has_date: true
    has_time: true
  calendar_day_event_start:
    has_date: true
    has_time: false
  calendar_day_event_end:
    has_date: true
    has_time: false
  # Custom-date picker for the chore postpone menu (see chore_postpone_apply
  # script below). Reading this helper's state server-side in the script is
  # simpler and more reliable than relying on browser_mod's popup-form value
  # forwarding, which didn't reliably pass the picked date through in testing.
  chore_postpone_custom_date:
    name: Postpone To
    has_date: true
    has_time: false

input_boolean:
  # UI Toggles
  calendar_all_day_event:
    name: All Day Event
    icon: mdi:calendar-clock
  family_calendar_show:
    name: Show Events
    icon: mdi:calendar-eye
    initial: false
  # Per-person, per-frequency-block collapse state for the chores board.
  # "on" means collapsed (hidden); default "off" (expanded).
  chore_collapse_satty_daily:
    name: Collapse Satty Daily chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_satty_weekly:
    name: Collapse Satty Weekly chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_satty_monthly:
    name: Collapse Satty Monthly chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_satty_quarterly:
    name: Collapse Satty Quarterly chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_satty_semiannual:
    name: Collapse Satty Semiannual chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_satty_yearly:
    name: Collapse Satty Yearly chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_priya_daily:
    name: Collapse Priya Daily chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_priya_weekly:
    name: Collapse Priya Weekly chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_priya_monthly:
    name: Collapse Priya Monthly chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_priya_quarterly:
    name: Collapse Priya Quarterly chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_priya_semiannual:
    name: Collapse Priya Semiannual chores
    icon: mdi:chevron-down
    initial: false
  chore_collapse_priya_yearly:
    name: Collapse Priya Yearly chores
    icon: mdi:chevron-down
    initial: false

# 2. SCRIPTS (The Logic)
script:
  # --- Filter Toggles ---
  # Independent per-person collapse: tapping Satty only shows/hides Satty's
  # own chores, tapping Priya only shows/hides Priya's - neither affects the
  # other's visibility.
  calendar1_calendar_visible_filter:
    alias: Toggle calendar1 Calendar
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar1_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar1_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  calendar2_calendar_visible_filter:
    alias: Toggle calendar2 Calendar
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar2_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar2_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  # --- Per-person color cycling ---
  # Both share the same 8-color palette; each person's helper just tracks
  # its own current index into it, wrapping around at the end.
  cycle_satty_color:
    alias: Cycle Satty's chore/name color
    sequence:
      - variables:
          palette: ["#fb8072", "#fdbf6f", "#80b1d3", "#b3de69", "#bc80bd", "#8dd3c7", "#fccde5", "#bebada"]
          current: "{{ states('input_text.satty_color') }}"
          idx: "{{ palette.index(current) if current in palette else 0 }}"
          next_color: "{{ palette[(idx + 1) % (palette | length)] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.satty_color
        data:
          value: "{{ next_color }}"

  cycle_bhavi_color:
    alias: Cycle Priya's chore/name color
    sequence:
      - variables:
          palette: ["#fb8072", "#fdbf6f", "#80b1d3", "#b3de69", "#bc80bd", "#8dd3c7", "#fccde5", "#bebada"]
          current: "{{ states('input_text.bhavi_color') }}"
          idx: "{{ palette.index(current) if current in palette else 0 }}"
          next_color: "{{ palette[(idx + 1) % (palette | length)] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.bhavi_color
        data:
          value: "{{ next_color }}"

  # --- Chore completion feedback popups (browser_mod) ---
  # Called from each chore tile's tap_action instead of calling
  # button.press directly, so completing/undoing also shows a center-
  # screen popup. browser_mod.popup targets whichever browser the tap
  # actually came from automatically when invoked via a card's own
  # tap_action (confirmed live - a raw service call from outside that
  # context does not reliably reach a specific browser).
  chore_complete_celebrate:
    alias: Complete a chore and celebrate
    fields:
      claim_entity_id:
        example: button.satty_choreops_claim_chore_take_out_trash
      chore_name:
        example: Take out trash
      person_name:
        example: Satty
      is_multi:
        description: True for a 2x/week or 2x/month chore - also increments its per-period progress counter.
        example: false
      chore_entity_id:
        example: sensor.priya_choreops_chore_status_laundry_wash_fold
      period_type:
        example: week
    sequence:
      - action: button.press
        target:
          entity_id: "{{ claim_entity_id }}"
      - if:
          - condition: template
            value_template: "{{ is_multi | default(false) }}"
        then:
          - action: script.chore_progress_track
            data:
              chore_entity_id: "{{ chore_entity_id }}"
              period_type: "{{ period_type }}"
              delta: 1
      - action: browser_mod.popup
        data:
          title: ""
          dismissable: true
          autoclose: true
          timeout: 2200
          timeout_action: close
          style: |
            .content { text-align: center; }
            ha-dialog { --dialog-content-padding: 32px; }
          content:
            type: markdown
            content: >-
              <div style="font-size:3.5em; line-height:1;">🎉🥳🎊</div>
              <div style="font-size:1.6em; font-weight:800; margin-top:0.2em;">Nice one, {{ person_name }}!</div>
              <div style="font-size:1.1em; opacity:0.8; margin-top:0.2em;">{{ chore_name }} - done</div>

  chore_undo_funny:
    alias: Undo a chore with a funny popup
    fields:
      disapprove_entity_id:
        example: button.satty_choreops_disapprove_chore_take_out_trash
      chore_name:
        example: Take out trash
      person_name:
        example: Satty
      is_multi:
        description: >-
          True for a 2x/week or 2x/month chore - decrements its per-period
          progress counter instead of disapproving, since ChoreOps has
          already auto-rescheduled the chore's own claim/approval by the
          time this fires (there's nothing pending left for it to disapprove).
        example: false
      chore_entity_id:
        example: sensor.priya_choreops_chore_status_laundry_wash_fold
      period_type:
        example: week
    sequence:
      - if:
          - condition: template
            value_template: "{{ is_multi | default(false) }}"
        then:
          - action: script.chore_progress_track
            data:
              chore_entity_id: "{{ chore_entity_id }}"
              period_type: "{{ period_type }}"
              delta: -1
        else:
          - action: button.press
            continue_on_error: true
            target:
              entity_id: "{{ disapprove_entity_id }}"
      - action: browser_mod.popup
        data:
          title: ""
          dismissable: true
          autoclose: true
          timeout: 1800
          timeout_action: close
          style: |
            .content { text-align: center; }
            ha-dialog { --dialog-content-padding: 32px; }
          content:
            type: markdown
            content: >-
              <div style="font-size:3.5em; line-height:1;">😅🙈</div>
              <div style="font-size:1.4em; font-weight:800; margin-top:0.2em;">Whoops, {{ person_name }}!</div>
              <div style="font-size:1em; opacity:0.8; margin-top:0.2em;">{{ chore_name }} is back on the list</div>

  # --- Chore postpone (long-press a chore tile) ---
  # Called from the "Tomorrow" / "Same day next week" / "Next month" /
  # "Custom date..." rows of the postpone popup (a one-tap icon on each
  # chore tile in dashboard.yaml, built via button-card JS templates - uses
  # browser_mod's fire-dom-event "Browser call" so it works without
  # registering the browser, unlike a plain browser_mod.popup service call).
  # offset is one of tomorrow|next_week|next_month|custom; for custom, the
  # target date is read directly from input_datetime.chore_postpone_custom_date
  # (set via the popup's own date row) rather than forwarded through the
  # popup form, which didn't reliably pass the picked value through.
  chore_postpone_apply:
    alias: Postpone a chore's due date
    fields:
      chore_name:
        example: Take out trash
      user_name:
        example: Satty
      offset:
        example: tomorrow
    sequence:
      - variables:
          due_date: >-
            {% set base = now() %}
            {% if offset == 'tomorrow' %}
              {{ (base + timedelta(days=1)).strftime('%Y-%m-%dT23:59:00') }}
            {% elif offset == 'next_week' %}
              {{ (base + timedelta(days=7)).strftime('%Y-%m-%dT23:59:00') }}
            {% elif offset == 'next_month' %}
              {% set target_month = base.month + 1 if base.month < 12 else 1 %}
              {% set target_year = base.year if base.month < 12 else base.year + 1 %}
              {% set days_in_target = 29 if (target_month == 2 and target_year % 4 == 0 and (target_year % 100 != 0 or target_year % 400 == 0)) else (28 if target_month == 2 else (30 if target_month in [4, 6, 9, 11] else 31)) %}
              {% set safe_day = [base.day, days_in_target] | min %}
              {{ base.replace(year=target_year, month=target_month, day=safe_day).strftime('%Y-%m-%dT23:59:00') }}
            {% else %}
              {{ states('input_datetime.chore_postpone_custom_date') }}T23:59:00
            {% endif %}
      - action: choreops.set_chore_due_date
        data:
          chore_name: "{{ chore_name }}"
          user_name: "{{ user_name }}"
          due_date: "{{ due_date }}"

  chore_progress_track:
    alias: Track a 2x/period chore's completions this period
    fields:
      chore_entity_id:
        example: sensor.priya_choreops_chore_status_laundry_wash_fold
      period_type:
        example: week
      delta:
        example: 1
    sequence:
      - variables:
          current: >-
            {% set raw = states('input_text.chore_period_progress') %}
            {{ (raw | from_json) if raw not in ['', 'unknown', 'unavailable'] else {} }}
          period_key: >-
            {% if period_type == 'week' %}
              {{ now().strftime('%G-W%V') }}
            {% else %}
              {{ now().strftime('%Y-%m') }}
            {% endif %}
      - variables:
          existing: "{{ current.get(chore_entity_id, {}) }}"
      - variables:
          existing_count: "{{ (existing.get('count', 0) | int) if existing.get('period') == period_key else 0 }}"
      - variables:
          new_count: >-
            {% set raw = existing_count + (delta | int) %}
            {% set low = [raw, 0] | max %}
            {{ [low, 2] | min }}
      - action: input_text.set_value
        target:
          entity_id: input_text.chore_period_progress
        data:
          value: >-
            {{ (current | combine({chore_entity_id: {'count': new_count, 'period': period_key}})) | tojson }}

  chore_reorder:
    alias: Move a chore up/down within its due-date group
    # The chore list is sorted by due_date; chores sharing the same day
    # (e.g. all "due today") tie-break in whatever order ChoreOps returns
    # them. Nudging the time-of-day by a minute (without changing the
    # calendar day) reorders a chore among its same-day siblings without
    # affecting which day it's due/overdue on - the badge and visibility
    # logic only ever look at the date portion (due.slice(0, 10)).
    fields:
      chore_entity:
        example: sensor.satty_choreops_chore_status_wash_dishes
      direction:
        example: up
    sequence:
      - variables:
          due: "{{ state_attr(chore_entity, 'due_date') }}"
          chore_name: "{{ state_attr(chore_entity, 'chore_name') }}"
          user_name: "{{ state_attr(chore_entity, 'user_name') }}"
      - if:
          - condition: template
            value_template: "{{ due is not none }}"
        then:
          - variables:
              # isoformat() keeps the UTC offset (e.g. "...+00:00") - a bare
              # strftime() strips it, and set_chore_due_date's parser then
              # reinterprets the naive string as LOCAL time, silently
              # shifting the due date by the local UTC offset (2+ hours,
              # not 1 minute) on every single press.
              new_due: >-
                {% set dt = as_datetime(due) %}
                {% set delta = timedelta(minutes=1) %}
                {{ (dt - delta if direction == 'up' else dt + delta).isoformat() }}
          - if:
              - condition: template
                value_template: "{{ as_datetime(new_due) > now() }}"
            then:
              - action: choreops.set_chore_due_date
                data:
                  chore_name: "{{ chore_name }}"
                  user_name: "{{ user_name }}"
                  due_date: "{{ new_due }}"

  calendar3_calendar_visible_filter:
    alias: Toggle calendar3 Calendar
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar3_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar3_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  calendar4_calendar_visible_filter:
    alias: Toggle calendar4 Calendar
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar4_calendar_filter
        data:
          value: "{% if is_state('input_text.calendar4_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  family_calendar_visible_filter:
    alias: Toggle Family Calendar
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.family_calendar_filter
        data:
          value: "{% if is_state('input_text.family_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  birthdays_calendar_visible_filter:
    alias: Toggle Birthdays Calendar
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.birthdays_calendar_filter
        data:
          value: "{% if is_state('input_text.birthdays_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  holidays_calendar_visible_filter:
    alias: Toggle Holidays Calendar
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.holidays_calendar_filter
        data:
          value: "{% if is_state('input_text.holidays_calendar_filter', '.*') %}^${% else %}.*{% endif %}"

  # --- Add Event Logic ---
  add_google_calendar_event:
    alias: Process Add Calendar Event
    sequence:
      - variables:
          # ====================================================================
          # CONFIGURATION: ENTITY MAPPING
          # Map the Dropdown Name (Left) to your Entity ID (Right).
          # ====================================================================
          calendar_map:
            "Satty": "calendar.srnarayanan1989_gmail_com"
            "Priya": "calendar.160294bpl_gmail_com"
          
          # Selects the entity based on the map above
          target_calendar: "{{ calendar_map.get(states('input_select.calendar_select'), 'calendar.family') }}"

      - choose:
          # Scenario A: All Day Event
          - conditions:
              - condition: state
                entity_id: input_boolean.calendar_all_day_event
                state: "on"
            sequence:
              - action: calendar.create_event
                target:
                  entity_id: "{{ target_calendar }}"
                data:
                  summary: "{{ states('input_text.calendar_event_title') }}"
                  description: "{{ states('input_text.calendar_event_description') }}"
                  start_date: "{{ states('input_datetime.calendar_day_event_start') }}"
                  # Google's all-day end_date is exclusive, so a same-day pick (the normal
                  # case for a single-day event) needs +1 day or the API rejects it as
                  # zero-duration ("Expected minimum event duration of 0:00:01")
                  end_date: "{{ (states('input_datetime.calendar_day_event_end') | as_datetime + timedelta(days=1)).strftime('%Y-%m-%d') }}"
          
          # Scenario B: Timed Event
          - conditions:
              - condition: state
                entity_id: input_boolean.calendar_all_day_event
                state: "off"
            sequence:
              - action: calendar.create_event
                target:
                  entity_id: "{{ target_calendar }}"
                data:
                  summary: "{{ states('input_text.calendar_event_title') }}"
                  description: "{{ states('input_text.calendar_event_description') }}"
                  start_date_time: "{{ states('input_datetime.calendar_event_start') }}"
                  end_date_time: "{{ states('input_datetime.calendar_event_end') }}"

      # Cleanup and Close
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar_event_title
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar_event_description
        data:
          value: ""
      - action: browser_mod.close_popup
        data: {}